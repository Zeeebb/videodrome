<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDEODROME</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --black: #000000;
      --dark: #0a0a0a;
      --gray: #1a1a1a;
      --gray-light: #2a2a2a;
      --white: #ffffff;
      --green: #39ff14;
      --green-glow: 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 40px #39ff14;
      --green-glow-soft: 0 0 10px rgba(57, 255, 20, 0.5);
      --red: #ff0040;
      --red-glow: 0 0 10px #ff0040, 0 0 20px #ff0040;
      --yellow: #ffff00;
    }
    
    body { 
      font-family: 'Space Mono', monospace;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 10000;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--black);
      border-bottom: 3px solid var(--green);
      box-shadow: var(--green-glow-soft);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      letter-spacing: 0.1em;
      color: var(--green);
      text-shadow: var(--green-glow);
    }
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    .user-select {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.05em;
      padding: 0.5rem 1rem;
      background: var(--black);
      border: 2px solid var(--green);
      color: var(--green);
      cursor: pointer;
    }
    .user-select:focus { outline: none; box-shadow: var(--green-glow-soft); }
    .stats { font-size: 0.75rem; color: var(--green); text-transform: uppercase; letter-spacing: 0.1em; }
    .sync-icon { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tabs { display: flex; background: var(--dark); overflow-x: auto; }
    .tab {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      padding: 1rem 2rem;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      text-transform: uppercase;
      position: relative;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--white); }
    .tab.active { color: var(--green); text-shadow: var(--green-glow-soft); }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--green);
      box-shadow: var(--green-glow);
    }
    .tab-badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      background: var(--red);
      color: var(--white);
      padding: 0.2rem 0.4rem;
      margin-left: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      padding: 1.5rem 2rem;
      background: var(--dark);
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid var(--gray);
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      background: var(--black);
      border: 2px solid var(--gray);
      color: var(--white);
    }
    .search-box:focus { outline: none; border-color: var(--green); box-shadow: var(--green-glow-soft); }
    .search-box::placeholder { color: #555; }
    select {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      padding: 0.75rem 1rem;
      background: var(--black);
      border: 2px solid var(--gray);
      color: var(--white);
      cursor: pointer;
    }
    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      padding: 0.75rem 1.5rem;
      background: var(--green);
      border: none;
      color: var(--black);
      cursor: pointer;
      text-transform: uppercase;
      transition: box-shadow 0.2s;
    }
    .btn:hover { box-shadow: var(--green-glow); }
    .btn-outline { background: transparent; border: 2px solid var(--green); color: var(--green); }
    .btn-red { background: var(--red); color: var(--white); }
    .btn-red:hover { box-shadow: var(--red-glow); }
    .btn-yellow { background: var(--yellow); color: var(--black); }

    .main { padding: 2rem; min-height: 60vh; }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      color: var(--green);
      text-shadow: var(--green-glow-soft);
      margin-bottom: 2rem;
      text-transform: uppercase;
    }
    .empty {
      text-align: center;
      padding: 4rem;
      color: #555;
      font-size: 0.9rem;
      border: 2px dashed var(--gray);
    }

    .featured {
      background: var(--dark);
      border: 3px solid var(--red);
      box-shadow: var(--red-glow), inset 0 0 100px rgba(255, 0, 64, 0.05);
      margin-bottom: 3rem;
      position: relative;
      cursor: pointer;
    }
    .featured::before {
      content: '▶ NEXT';
      position: absolute;
      top: 0; right: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      background: var(--red);
      color: var(--white);
      padding: 0.5rem 1.5rem;
    }
    .featured-inner { display: flex; gap: 2rem; padding: 2rem; }
    .featured-vhs { width: 160px; flex-shrink: 0; perspective: 500px; }
    .featured-vhs-box { transform: rotateY(-8deg) rotateX(2deg); }
    .featured-vhs-box img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border: 4px solid var(--white);
      box-shadow: 8px 8px 0 var(--black), 12px 12px 0 var(--red);
    }
    .featured-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .featured-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    .featured-meta { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
    .featured-proposer {
      display: inline-block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.8rem;
      background: var(--red);
    }
    @media (max-width: 600px) {
      .featured-inner { flex-direction: column; align-items: center; text-align: center; }
      .featured-vhs { width: 140px; }
    }

    .vhs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      padding: 1rem;
    }
    .vhs-card { width: 140px; perspective: 800px; cursor: pointer; }
    .vhs-box {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
    }
    .vhs-card:nth-child(5n+1) .vhs-box { transform: rotateY(-5deg) rotateZ(-2deg); }
    .vhs-card:nth-child(5n+2) .vhs-box { transform: rotateY(4deg) rotateZ(1.5deg); }
    .vhs-card:nth-child(5n+3) .vhs-box { transform: rotateY(-3deg) rotateZ(2deg); }
    .vhs-card:nth-child(5n+4) .vhs-box { transform: rotateY(6deg) rotateZ(-1deg); }
    .vhs-card:nth-child(5n+5) .vhs-box { transform: rotateY(-4deg) rotateZ(-2.5deg); }
    .vhs-card:hover .vhs-box { transform: rotateY(0deg) rotateZ(0deg) translateY(-10px) scale(1.05); }
    .vhs-sleeve {
      position: relative;
      border: 3px solid var(--white);
      background: var(--gray);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.8), 8px 8px 15px rgba(0,0,0,0.5);
    }
    .vhs-sleeve::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 20px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
    }
    .vhs-sleeve img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .vhs-noimg {
      width: 100%;
      aspect-ratio: 2/3;
      background: linear-gradient(135deg, var(--gray) 0%, var(--dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #444;
    }
    .vhs-tape {
      height: 25px;
      background: var(--black);
      border: 3px solid var(--white);
      border-top: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .vhs-tape::before, .vhs-tape::after {
      content: '';
      width: 15px; height: 15px;
      background: var(--gray);
      border-radius: 50%;
      border: 2px solid #555;
    }
    .vhs-label {
      position: absolute;
      bottom: 30px; left: 0; right: 0;
      padding: 1rem 0.5rem 0.5rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.95));
    }
    .vhs-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .vhs-meta { font-size: 0.65rem; color: #888; margin-top: 0.2rem; }
    .vhs-badges { position: absolute; top: 5px; right: 5px; display: flex; flex-direction: column; gap: 3px; }
    .vhs-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.4rem;
    }
    .vhs-badge.fav { background: var(--red); color: var(--white); }
    .vhs-badge.vote { background: var(--yellow); color: var(--black); }
    .vhs-badge.scheduled { background: var(--green); color: var(--black); }
    .vhs-proposer {
      position: absolute;
      top: 5px; left: 5px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.4rem;
      color: var(--black);
    }
    .vhs-fav-btn {
      position: absolute;
      bottom: 60px; right: 8px;
      width: 28px; height: 28px;
      background: rgba(0,0,0,0.8);
      border: 2px solid var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
    }
    .vhs-card:hover .vhs-fav-btn { opacity: 1; }
    .vhs-fav-btn:hover { background: var(--red); }
    .vhs-fav-btn.active { opacity: 1; background: var(--red); }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal {
      background: var(--dark);
      border: 3px solid var(--green);
      box-shadow: var(--green-glow);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--black);
      border-bottom: 2px solid var(--gray);
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      color: var(--green);
      text-transform: uppercase;
    }
    .modal-close { background: none; border: none; color: #666; font-size: 1.5rem; cursor: pointer; }
    .modal-close:hover { color: var(--red); }
    .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      background: var(--black);
      border-top: 2px solid var(--gray);
      flex-wrap: wrap;
    }
    .modal-actions .btn { flex: 1; text-align: center; }

    .detail-top { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
    .detail-poster { width: 120px; flex-shrink: 0; }
    .detail-poster img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border: 3px solid var(--white);
    }
    .detail-info { flex: 1; }
    .detail-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    .detail-meta { color: #888; font-size: 0.8rem; }
    .detail-proposer {
      display: inline-block;
      margin-top: 0.75rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      padding: 0.25rem 0.6rem;
      color: var(--black);
    }
    .detail-section { margin-top: 1.5rem; }
    .detail-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      color: var(--green);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .detail-text { font-size: 0.85rem; line-height: 1.6; color: #ccc; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag { font-size: 0.7rem; padding: 0.3rem 0.6rem; background: var(--gray); border: 1px solid var(--gray-light); }
    .voters-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .voter-chip {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 0.3rem 0.6rem;
      background: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .voter-chip.fav::before { content: '♥'; color: var(--red); }
    .voter-chip.vote::before { content: '▲'; color: var(--green); }
    .links { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .link-btn {
      font-size: 0.75rem;
      padding: 0.5rem 0.8rem;
      background: var(--gray);
      border: 1px solid var(--gray-light);
      color: var(--white);
      text-decoration: none;
      transition: all 0.2s;
    }
    .link-btn:hover { border-color: var(--green); color: var(--green); }

    .search-results { display: flex; flex-direction: column; gap: 0.5rem; max-height: 300px; overflow-y: auto; margin: 1rem 0; }
    .search-result {
      display: flex;
      gap: 1rem;
      padding: 0.75rem;
      background: var(--black);
      border: 2px solid var(--gray);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .search-result:hover { border-color: var(--green); }
    .search-result img { width: 50px; height: 75px; object-fit: cover; }
    .result-noimg { width: 50px; height: 75px; background: var(--gray); display: flex; align-items: center; justify-content: center; color: #555; }
    .result-title { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .result-meta { font-size: 0.75rem; color: #888; }

    .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .calendar-month { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; }
    .calendar-header { font-family: 'Bebas Neue', sans-serif; font-size: 0.8rem; color: #666; text-align: center; padding: 0.5rem; }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gray);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .calendar-day:hover { border-color: var(--green); }
    .calendar-day.available { border-color: var(--green); background: rgba(57, 255, 20, 0.1); box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.1); }
    .calendar-day.past { opacity: 0.3; pointer-events: none; }
    .calendar-day-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; }
    .calendar-day-count { position: absolute; bottom: 2px; font-size: 0.6rem; color: var(--green); }

    .history-item {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: var(--dark);
      border: 2px solid var(--gray);
      margin-bottom: 0.75rem;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .history-item:hover { border-color: var(--green); }
    .history-poster { width: 50px; flex-shrink: 0; }
    .history-poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border: 2px solid var(--white); }
    .history-info { flex: 1; }
    .history-title { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .history-meta { font-size: 0.75rem; color: #888; }
    .history-date { font-family: 'Bebas Neue', sans-serif; font-size: 0.8rem; letter-spacing: 0.1em; padding: 0.4rem 0.8rem; border: 2px solid var(--green); color: var(--green); }

    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .member-card { background: var(--dark); border: 2px solid var(--gray); padding: 1.5rem 1rem; text-align: center; transition: border-color 0.2s; }
    .member-card:hover { border-color: var(--green); }
    .member-avatar { width: 60px; height: 60px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--black); }
    .member-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .member-stats { font-size: 0.7rem; color: #888; line-height: 1.6; }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      padding: 0.75rem 2rem;
      background: var(--green);
      color: var(--black);
      box-shadow: var(--green-glow);
      z-index: 2000;
      animation: toastIn 0.3s ease;
    }
    .toast.error { background: var(--red); color: var(--white); box-shadow: var(--red-glow); }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 2rem; }
    .loading-logo { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 0.15em; color: var(--green); text-shadow: var(--green-glow); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .suggestions { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px solid var(--gray); }
    .suggestions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .suggestion-card { position: relative; border: 2px solid var(--gray); overflow: hidden; transition: border-color 0.2s; }
    .suggestion-card:hover { border-color: var(--green); }
    .suggestion-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .suggestion-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.5rem 0.4rem 0.3rem; background: linear-gradient(transparent, rgba(0,0,0,0.95)); }
    .suggestion-title { font-size: 0.55rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
