  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Fraunces', Georgia, serif; background: #f5f0e6; color: #1a1a1a; min-height: 100vh; }
    .btn { background: #e63946; color: #f5f0e6; border: none; padding: 0.75rem 1.5rem; font-family: inherit; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
    .btn:hover { transform: scale(1.05); }
    .btn-outline { background: transparent; border: 2px solid #1a1a1a; color: #1a1a1a; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal { background: #f5f0e6; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border-bottom: 2px solid #1a1a1a; }
    .modal-close { background: none; border: none; font-size: 2rem; cursor: pointer; line-height: 1; }
    .modal-body { padding: 1.5rem; }
    .modal-actions { display: flex; gap: 0.75rem; padding: 1.5rem; border-top: 2px solid #1a1a1a; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; padding: 0.75rem 1rem; border: 2px solid #1a1a1a; background: #f5f0e6; font-family: inherit; font-size: 1rem; }
    .search-results { max-height: 400px; overflow-y: auto; }
    .search-result { display: flex; gap: 1rem; padding: 0.75rem; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.1); }
    .search-result:hover { background: rgba(0,0,0,0.05); }
    .search-result img { width: 50px; height: 75px; object-fit: cover; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #f5f0e6; padding: 1rem 2rem; font-weight: 700; z-index: 2000; }
    .loading-screen { position: fixed; inset: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .loading-logo { font-size: 3rem; font-weight: 700; color: #f5f0e6; animation: pulse 1.5s ease infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .sync-icon { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    /* Adaptation grandes résolutions */
    @media (min-width: 1600px) {
      body { font-size: 1.1rem; }
      .btn { padding: 0.9rem 1.8rem; font-size: 1.05rem; }
      .search-box { padding: 0.9rem 1.2rem; font-size: 1.1rem; }
      .modal { max-width: 750px; }
      .modal-head { padding: 1.8rem; }
      .modal-body { padding: 1.8rem; }
      .modal-actions { padding: 1.8rem; }
    }

      .search-box { padding: 1rem 1.4rem; font-size: 1.2rem; }

// Cassette VHS SVG (SVG exact fourni, pivoté -90° pour être vertical)
const VHSTape = ({ title }) => {
  // Fonction pour couper le titre en lignes (max 10 char par ligne, entre les mots)
  const splitTitle = (text) => {
    if (!text || text.length <= 10) return [text];
    const words = text.split(' ');
    const lines = [];
    let currentLine = '';
    
    for (const word of words) {
      if (currentLine.length === 0) {
        currentLine = word;
      } else if ((currentLine + ' ' + word).length <= 12) {
        currentLine += ' ' + word;
      } else {
        lines.push(currentLine);
        currentLine = word;
      }
    }
    if (currentLine) lines.push(currentLine);
    return lines.slice(0, 3); // Max 3 lignes
  };
  
  const lines = splitTitle(title);

// Sticker étoile 12 branches pour les votes
const generateStarPath = (cx, cy, outerR, innerR, points) => {
  let path = '';
  for (let i = 0; i < points * 2; i++) {
    const angle = (i * Math.PI) / points - Math.PI / 2;
    const r = i % 2 === 0 ? outerR : innerR;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    path += (i === 0 ? 'M' : 'L') + x + ',' + y;
  }
  return path + 'Z';
};

// Positions pour stickers (votes ET favoris)
const STICKER_POS = [
  { top: '8%', right: '6%', rot: -15 },
  { top: '25%', right: '4%', rot: 10 },
  { top: '42%', right: '8%', rot: -8 },
  { top: '58%', right: '5%', rot: 18 },
  { top: '15%', right: '12%', rot: -20 },
];

// Sticker Like (étoile)
const LikeSticker = ({ memberId, index }) => {
  const m = getMember(memberId);
  const p = STICKER_POS[index % STICKER_POS.length];
  const rot = p.rot + (index * 13) % 25 - 12;
  const star = generateStarPath(22, 22, 22, 16, 12);
  return (
    <div style={{ position: 'absolute', top: p.top, right: p.right, transform: `rotate(${rot}deg)`, zIndex: 20 + index, pointerEvents: 'none' }}>
      <svg width="44" height="44" viewBox="0 0 44 44" style={{ filter: 'drop-shadow(1px 1px 2px rgba(0,0,0,0.5))' }}>
        <path d={star} fill={m.color} />
        <text x="22" y="22" textAnchor="middle" dominantBaseline="central" style={{ fontSize: m.initial.length > 1 ? 10 : 14, fontWeight: 800, fill: '#fff' }}>{m.initial}</text>
      </svg>
    </div>
  );
};

// VHS Card avec cassette qui sort + rotation/hauteur aléatoire pour effet vrac
const VHSCard = ({ film, index, onClick, onLike, user, userLikesCount = 0, maxLikes = 6 }) => {
  const [isActive, setIsActive] = React.useState(false);
  const [isAnimating, setIsAnimating] = React.useState(false);
  const boxWidth = 200, boxHeight = 295, tapeWidth = 200;
  const member = getMember(film.proposedBy);
  const isLiked = film.likes?.includes(user);
  const canLike = isLiked || userLikesCount < maxLikes;
  
  // Rotation et décalage aléatoire basé sur l'index (effet vrac)
  const randomRotation = React.useMemo(() => ((index * 17) % 11) - 5, [index]); // -5 à +5 degrés
  const randomOffset = React.useMemo(() => ((index * 23) % 20) - 10, [index]); // -10 à +10 px
  
  const handleEnter = () => { setIsActive(true); setIsAnimating(true); };
  const handleLeave = () => { setIsActive(false); setTimeout(() => setIsAnimating(false), 450); };
  const getZ = () => isActive ? 200 : (isAnimating ? 100 : 1);
  
  return (
    <div 
      style={{ 
        width: boxWidth + tapeWidth * 0.7, 
        height: boxHeight + 50, 
        cursor: 'pointer', 
        position: 'relative', 
        zIndex: getZ(),
        marginTop: randomOffset,
      }} 
      onMouseEnter={handleEnter} 
      onMouseLeave={handleLeave} 
      onClick={onClick}
    >
      <div style={{ 
        position: 'relative', 
        width: boxWidth, 
        height: boxHeight, 
        transform: isActive ? 'scale(1.35)' : `scale(1) rotate(${randomRotation}deg)`, 
        transformOrigin: 'center center',
        transition: 'transform 0.4s ease',
      }}>
        {/* Cassette qui sort à 65% par la droite avec shadow de la boite */}
        <div style={{ 
          position: 'absolute', 
          top: 0, 
          right: isActive ? -(tapeWidth * 0.65) : -10, 
          width: tapeWidth, 
          height: boxHeight, 
          transition: 'right 0.4s ease', 
          zIndex: -1, 
          pointerEvents: 'none',
          filter: 'drop-shadow(-8px 0 10px rgba(0,0,0,0.4))'
        }}>
          <VHSTape title={film.title} />
        </div>
        
        {/* Boîtier principal avec encoche */}
        <div style={{ 
          position: 'absolute', 
          width: '100%', 
          height: '100%', 
          background: '#000', 
          boxShadow: isActive ? '0 25px 50px rgba(0,0,0,0.5)' : '8px 8px 20px rgba(0,0,0,0.3)', 
          overflow: 'hidden',
          clipPath: 'polygon(0 0, 100% 0, 100% 40%, 94% 43%, 94% 57%, 100% 60%, 100% 100%, 0 100%)'
        }}>
          {/* Stickers likes (étoiles) */}
          {film.likes?.map((v, i) => <LikeSticker key={`l-${v}`} memberId={v} index={i} />)}
          
          {/* Poster éclairci de 3% */}
          {film.poster ? (
            <img src={film.poster} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', filter: 'brightness(1.03)' }} />
          ) : (
            <VHSPoster title={film.title} />
          )}
          
          {/* Reflet subtil gauche->droite (5% opacité) */}
          <div style={{ 
            position: 'absolute', 
            top: 0, 
            left: 0, 
            width: '100%', 
            height: '100%', 
            background: 'linear-gradient(to right, rgba(255,255,255,0.05), transparent 50%)',
            pointerEvents: 'none',
            zIndex: 15
          }}></div>
          
          {/* Rimlight gauche - SUR la boite, crème -> transparent */}
          <div style={{ 
            position: 'absolute', 
            top: 0, 
            left: 0, 
            width: 1, 
            height: '100%', 
            background: `linear-gradient(to bottom, ${COLORS.cream}, transparent)`,
            zIndex: 25,
            pointerEvents: 'none'
          }}></div>
          
          {/* Rimlight haut - SUR la boite, crème -> transparent */}
          <div style={{ 
            position: 'absolute', 
            top: 0, 
            left: 0, 
            width: '100%', 
            height: 1, 
            background: `linear-gradient(to right, ${COLORS.cream}, transparent)`,
            zIndex: 25,
            pointerEvents: 'none'
          }}></div>
          
          {/* Bouton like - seulement visible au hover */}
          {isActive && (
            <button 
              onClick={(e) => { e.stopPropagation(); if (canLike) onLike(); }} 
              style={{ 
                position: 'absolute', top: 10, right: 10, 
                background: isLiked ? COLORS.red : 'rgba(0,0,0,0.7)', 
                border: 'none', borderRadius: '50%', 
                width: 40, height: 40, fontSize: '1.3rem', 
                cursor: canLike ? 'pointer' : 'not-allowed', 
                zIndex: 30, transition: 'transform 0.2s',
                opacity: canLike ? 1 : 0.5,
                color: isLiked ? '#fff' : '#ffd700'
              }}
            >
              {isLiked ? '★' : '☆'}
            </button>
          )}
          
          {/* Titre */}
          <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, background: 'linear-gradient(transparent, rgba(0,0,0,0.9))', padding: '3rem 0.85rem 0.85rem', zIndex: 20 }}>
            <div style={{ color: '#fff', fontWeight: 700, fontSize: '1rem', textTransform: 'uppercase', textShadow: '1px 1px 0 #000' }}>{film.title}</div>
            <div style={{ color: '#aaa', fontSize: '0.85rem' }}>{film.year}</div>
          </div>
        </div>
      </div>
    </div>
  );
};

// Roue de la fortune style VHS 80s
const WheelModal = ({ films, onClose, onResult }) => {
  const [spinning, setSpinning] = React.useState(false);
  const [rotation, setRotation] = React.useState(0);
  const [winner, setWinner] = React.useState(null);
  
  const segmentAngle = 360 / films.length;
  
  // Couleurs VHS retro
  const colors = ['#e63946', '#f4a261', '#e9c46a', '#2a9d8f', '#457b9d', '#9b5de5', '#f15bb5', '#00bbf9'];
  
  const spin = () => {
    if (spinning) return;
    setSpinning(true);
    setWinner(null);
    
    // Random entre 5 et 8 tours + position aléatoire
    const spins = 5 + Math.random() * 3;
    const extraAngle = Math.random() * 360;
    const totalRotation = rotation + (spins * 360) + extraAngle;
    
    setRotation(totalRotation);
    
    // Calculer le gagnant après l'animation
    setTimeout(() => {
      // La roue tourne dans le sens horaire (rotate positif)
      // L'aiguille est fixe en haut (-90° en coordonnées SVG)
      // Après rotation de R degrés, le segment sous l'aiguille est celui qui était à l'angle (-90° - R)
      const R = totalRotation % 360;
      const normalizedAngle = ((360 - R) % 360); // Angle sur la roue non-tournée qui se trouve maintenant en haut
      const winnerIndex = Math.floor(normalizedAngle / segmentAngle) % films.length;
      setWinner(films[winnerIndex]);
      setSpinning(false);
    }, 4000);
  };
  
  const confirm = () => {
    if (winner) {
      onResult(winner);
    }
  };
  
  return (
    <div className="modal-bg" onClick={spinning ? null : onClose}>
      <div onClick={e => e.stopPropagation()} style={{ 
        background: COLORS.black, 
        padding: '2rem', 
        maxWidth: 600, 
        width: '95%',
        position: 'relative',
        border: `4px solid ${COLORS.cream}`
      }}>
        {/* Header style VHS */}
        <div style={{ 
          background: 'linear-gradient(90deg, #e63946, #f4a261, #e9c46a, #2a9d8f, #457b9d)',
          height: 6,
          marginBottom: '1.5rem'
        }}></div>
        
        <h2 style={{ 
          color: COLORS.cream, 
          fontSize: '1.8rem', 
          fontWeight: 700, 
          textTransform: 'uppercase',
          textAlign: 'center',
          marginBottom: '1.5rem',
          textShadow: '2px 2px 0 #e63946'
        }}>
          🎰 La Roue du Destin 🎰
        </h2>
        
        {/* Container de la roue */}
        <div style={{ position: 'relative', width: 320, height: 320, margin: '0 auto 1.5rem' }}>
          {/* Aiguille */}
          <div style={{ 
            position: 'absolute', 
            top: -15, 
            left: '50%', 
            transform: 'translateX(-50%)',
            zIndex: 10,
            fontSize: '2rem',
            filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))'
          }}>
            ▼
          </div>
          
          {/* Roue */}
          <svg 
            width="320" 
            height="320" 
            viewBox="0 0 320 320"
            style={{ 
              transform: `rotate(${rotation}deg)`,
              transition: spinning ? 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)' : 'none',
              filter: 'drop-shadow(0 4px 20px rgba(0,0,0,0.5))'
            }}
          >
            {/* Cercle extérieur décoratif */}
            <circle cx="160" cy="160" r="158" fill="none" stroke={COLORS.cream} strokeWidth="4"/>
            
            {/* Segments */}
            {films.map((film, i) => {
              const startAngle = i * segmentAngle - 90;
              const endAngle = startAngle + segmentAngle;
              const startRad = (startAngle * Math.PI) / 180;
              const endRad = (endAngle * Math.PI) / 180;
              const x1 = 160 + 150 * Math.cos(startRad);
              const y1 = 160 + 150 * Math.sin(startRad);
              const x2 = 160 + 150 * Math.cos(endRad);
              const y2 = 160 + 150 * Math.sin(endRad);
              const largeArc = segmentAngle > 180 ? 1 : 0;
              
              // Position du texte
              const midAngle = ((startAngle + endAngle) / 2 * Math.PI) / 180;
              const textR = 100;
              const textX = 160 + textR * Math.cos(midAngle);
              const textY = 160 + textR * Math.sin(midAngle);
              const textRotation = (startAngle + endAngle) / 2 + 90;
              
              return (
                <g key={film.id}>
                  <path 
                    d={`M160,160 L${x1},${y1} A150,150 0 ${largeArc},1 ${x2},${y2} Z`}
                    fill={colors[i % colors.length]}
                    stroke={COLORS.black}
                    strokeWidth="2"
                  />
                  <text
                    x={textX}
                    y={textY}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    transform={`rotate(${textRotation}, ${textX}, ${textY})`}
                    style={{ 
                      fontSize: films.length > 5 ? 10 : 12, 
                      fontWeight: 700, 
                      fill: '#fff',
                      textShadow: '1px 1px 0 #000'
                    }}
                  >
                    {film.title.length > 15 ? film.title.substring(0, 14) + '…' : film.title}
                  </text>
                </g>
              );
            })}
            
            {/* Centre */}
            <circle cx="160" cy="160" r="25" fill={COLORS.black} stroke={COLORS.cream} strokeWidth="3"/>
            <text x="160" y="160" textAnchor="middle" dominantBaseline="middle" style={{ fontSize: 20, fill: COLORS.cream }}>📼</text>
          </svg>
        </div>
        
        {/* Affichage du gagnant */}
        {winner && (
          <div style={{ 
            background: COLORS.red, 
            padding: '1rem', 
            marginBottom: '1.5rem',
            textAlign: 'center',
            animation: 'pulse 0.5s ease infinite'
          }}>
            <div style={{ color: COLORS.cream, fontSize: '0.9rem', textTransform: 'uppercase', marginBottom: '0.3rem' }}>
              🎉 Le destin a choisi 🎉
            </div>
            <div style={{ color: COLORS.cream, fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase' }}>
              {winner.title}
            </div>
          </div>
        )}
        
        {/* Boutons */}
        <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center' }}>
          {!winner ? (
            <button 
              className="btn" 
              onClick={spin}
              disabled={spinning}
              style={{ 
                fontSize: '1.2rem', 
                padding: '1rem 2rem',
                opacity: spinning ? 0.7 : 1
              }}
            >
              {spinning ? '🎰 Ça tourne...' : '🎰 Lancer la roue !'}
            </button>
          ) : (
            <>
              <button className="btn btn-outline" onClick={() => { setWinner(null); }} style={{ color: COLORS.cream, borderColor: COLORS.cream }}>
                Relancer
              </button>
              <button className="btn" onClick={confirm}>
                ✓ Programmer "{winner.title}"
              </button>
            </>
          )}
        </div>
        
        {!winner && !spinning && (
          <button 
            onClick={onClose}
            style={{ 
              position: 'absolute', 
              top: '1rem', 
              right: '1rem', 
              background: 'none', 
              border: 'none', 
              color: COLORS.cream, 
              fontSize: '1.5rem', 
              cursor: 'pointer' 
            }}
          >
            ×
          </button>
        )}
      </div>
    </div>
  );
};

// App principale
const MAX_LIKES = 6;

const App = () => {
  const [user, setUser] = React.useState(() => localStorage.getItem('vd_user') || 'seb');
  const [tab, setTab] = React.useState('propositions');
  const [films, setFilms] = React.useState(() => { try { return JSON.parse(localStorage.getItem('vd_films')) || []; } catch { return []; } });
  const [avail, setAvail] = React.useState(() => { try { return JSON.parse(localStorage.getItem('vd_avail')) || {}; } catch { return {}; } });
  const [search, setSearch] = React.useState('');
  const [sort, setSort] = React.useState('likes');
  const [selected, setSelected] = React.useState(null);
  const [showAdd, setShowAdd] = React.useState(false);
  const [showWheel, setShowWheel] = React.useState(false);
  const [loading, setLoading] = React.useState(true);
  const [syncing, setSyncing] = React.useState(false);
  const [toast, setToast] = React.useState(null);

  React.useEffect(() => { localStorage.setItem('vd_user', user); }, [user]);
  React.useEffect(() => { localStorage.setItem('vd_films', JSON.stringify(films)); }, [films]);
  React.useEffect(() => { localStorage.setItem('vd_avail', JSON.stringify(avail)); }, [avail]);
  React.useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    if (!SHEETS_API || SHEETS_API === 'COLLE_TON_URL_ICI') { setLoading(false); return; }
    setSyncing(true);
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      const res = await fetch(SHEETS_API, { signal: controller.signal });
      clearTimeout(timeoutId);
      const data = await res.json();
      if (data.films) setFilms(data.films.map(f => ({ 
        ...f, 
        id: parseInt(f.id) || f.id, 
        year: parseInt(f.year) || 0, 
        likes: f.likes ? (typeof f.likes === 'string' ? JSON.parse(f.likes) : f.likes) : (f.votes ? (typeof f.votes === 'string' ? JSON.parse(f.votes) : f.votes) : [])
      })));
      if (data.availabilities) setAvail(data.availabilities);
      notify('Données synchronisées');
    } catch(e) { 
      console.error('Erreur chargement:', e); 
    }
    setSyncing(false);
    setLoading(false);
  };

  const save = async (f, a) => {
    if (!SHEETS_API || SHEETS_API === 'COLLE_TON_URL_ICI') return;
    setSyncing(true);
    try { await fetch(SHEETS_API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ films: f || films, availabilities: a || avail }) }); } catch(e) { console.error(e); }
    setSyncing(false);
  };

  const scheduled = films.find(f => f.status === 'scheduled');
  const proposed = films.filter(f => f.status === 'proposed');
  const watched = films.filter(f => f.status === 'watched').sort((a, b) => new Date(b.watchedDate) - new Date(a.watchedDate));
  
  // Compteur de likes de l'utilisateur
  const userLikesCount = proposed.filter(f => f.likes?.includes(user)).length;

  // Tri par likes
  const sortedByLikes = [...proposed].sort((a, b) => (b.likes?.length || 0) - (a.likes?.length || 0));

  // Calcul des finalistes : Top 3 OU tous les ex-aequo (le plus grand)
  const getFinalists = () => {
    if (sortedByLikes.length === 0) return [];
    
    // Films avec au moins 1 like
    const withLikes = sortedByLikes.filter(f => (f.likes?.length || 0) > 0);
    if (withLikes.length === 0) return [];
    
    const topLikes = withLikes[0].likes?.length || 0;
    const exaequo = withLikes.filter(f => (f.likes?.length || 0) === topLikes);
    
    // Si plus de 3 ex-aequo en tête, on les prend tous
    if (exaequo.length >= 3) return exaequo;
    
    // Sinon on prend le top 3 (ou moins s'il n'y a pas assez de films)
    return withLikes.slice(0, 3);
  };
  
  const finalists = getFinalists();
  const canLaunchWheel = finalists.length >= 2 && !scheduled;

  const filtered = React.useMemo(() => {
    let r = [...proposed];
    if (search) { const q = search.toLowerCase(); r = r.filter(f => f.title?.toLowerCase().includes(q) || f.director?.toLowerCase().includes(q)); }
    switch(sort) {
      case 'likes': return r.sort((a, b) => (b.likes?.length || 0) - (a.likes?.length || 0));
      case 'recent': return r.sort((a, b) => b.id - a.id);
      case 'year': return r.sort((a, b) => b.year - a.year);
      case 'alpha': return r.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'fr'));
      default: return r;
    }
  }, [proposed, search, sort]);

  const notify = (msg) => setToast(msg);

  const add = (film) => {
    const nf = { ...film, id: Date.now(), proposedBy: user, proposedDate: new Date().toISOString(), status: 'proposed', likes: [] };
    const newFilms = [nf, ...films];
    setFilms(newFilms); save(newFilms); setShowAdd(false);
    notify(`"${film.title}" ajouté`);
  };

  const like = (id) => {
    const film = films.find(f => f.id === id);
    const isLiked = film?.likes?.includes(user);
    if (!isLiked && userLikesCount >= MAX_LIKES) {
      notify(`Maximum ${MAX_LIKES} votes atteint !`);
      return;
    }
    const newFilms = films.map(f => f.id !== id ? f : { ...f, likes: (f.likes || []).includes(user) ? f.likes.filter(v => v !== user) : [...(f.likes || []), user] });
    setFilms(newFilms); save(newFilms);
    if (selected?.id === id) setSelected(newFilms.find(f => f.id === id));
  };

  const schedule = (id) => {
    const newFilms = films.map(f => ({ ...f, status: f.id === id ? 'scheduled' : (f.status === 'scheduled' ? 'proposed' : f.status) }));
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film programmé !');
  };
  
  const wheelResult = (film) => {
    schedule(film.id);
    setShowWheel(false);
  };

  const unschedule = (id) => {
    const newFilms = films.map(f => f.id === id ? { ...f, status: 'proposed' } : f);
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film déprogrammé');
  };

  const markWatched = (id, date) => {
    const newFilms = films.map(f => f.id === id ? { ...f, status: 'watched', watchedDate: date || new Date().toISOString() } : f);
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film vu !');
  };

  const del = (id) => {
    if (!confirm('Supprimer ce film ?')) return;
    const newFilms = films.filter(f => f.id !== id);
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film supprimé');
  };

  const toggleAvail = (date) => {
    const k = date.toISOString().split('T')[0];
    const cur = avail[k] || [];
    const newAvail = { ...avail, [k]: cur.includes(user) ? cur.filter(u => u !== user) : [...cur, user] };
    setAvail(newAvail); save(null, newAvail);
  };

  if (loading) return (

                    <h2 style={{ color: COLORS.cream, fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', margin: 0 }}>
                      🎰 Finalistes ({finalists.length})
                    </h2>
                    <span style={{ color: COLORS.cream, opacity: 0.8, fontSize: '0.9rem' }}>
                      Prêts à lancer la roue du destin ?
                    </span>
                  </div>
                  <button 
                    className="btn" 
                    onClick={() => setShowWheel(true)}
                    style={{ 
                      fontSize: '1.1rem', 
                      padding: '0.75rem 1.5rem',
                      animation: 'pulse 2s ease infinite'

                    🎰 Lancer la roue !
                  </button>
                </div>

                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                  {finalists.map((f, i) => (

                      index={i}

                  <option value="year">Année</option>
                  <option value="alpha">A → Z</option>
                </select>
                <button className="btn" onClick={() => setShowAdd(true)}>+ Proposer</button>
                <div style={{ marginLeft: 'auto', fontSize: '0.9rem', color: COLORS.grey }}>

                {filtered.map((f, i) => <VHSCard key={f.id} film={f} index={i} onClick={() => setSelected(f)} onLike={() => like(f.id)} user={user} userLikesCount={userLikesCount} />)}

              </div>
            </div>
          </section>
        </>
      )}

      {tab === 'planning' && <Planning avail={avail} user={user} onToggle={toggleAvail} />}

      {showWheel && <WheelModal films={finalists} onClose={() => setShowWheel(false)} onResult={wheelResult} />}
      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
};

// Planning
const Planning = ({ avail, user, onToggle }) => {
  const [month, setMonth] = React.useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });
  const today = new Date(); today.setHours(0,0,0,0);
  const dim = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
  const first = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
  const offset = first === 0 ? 6 : first - 1;
  const days = [...Array(offset).fill(null), ...Array.from({length: dim}, (_, i) => new Date(month.getFullYear(), month.getMonth(), i + 1))];
  const mName = month.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  const best = Object.entries(avail).filter(([d]) => new Date(d) >= today).map(([d, u]) => ({ d, u, c: u.length })).sort((a, b) => b.c - a.c).slice(0, 5);

  return (
    <section style={{ background: COLORS.cream, padding: '2rem' }}>
      <div style={{ maxWidth: 800, margin: '0 auto' }}>
        <h2 style={{ fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1.5rem' }}>Tes disponibilités</h2>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
          <button className="btn btn-outline" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))}>←</button>
          <div style={{ fontWeight: 700, fontSize: '1.1rem', textTransform: 'capitalize' }}>{mName}</div>
          <button className="btn btn-outline" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))}>→</button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, background: 'white', padding: '1rem' }}>
          {['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d => <div key={d} style={{ textAlign: 'center', fontWeight: 700, fontSize: '0.8rem', color: COLORS.grey, padding: '0.5rem' }}>{d}</div>)}
          {days.map((date, i) => { if (!date) return <div key={`e${i}`} />; const k = date.toISOString().split('T')[0]; const members = avail[k] || []; const isA = members.includes(user); const past = date < today; return <div key={k} onClick={() => !past && onToggle(date)} style={{ aspectRatio: '1', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: past ? 'default' : 'pointer', border: '2px solid transparent', background: isA ? COLORS.red : 'transparent', color: isA ? COLORS.cream : COLORS.black, opacity: past ? 0.3 : 1 }}><div style={{ fontWeight: 700 }}>{date.getDate()}</div>{members.length > 0 && <div style={{ fontSize: '0.7rem', opacity: 0.8 }}>{members.length}</div>}</div>; })}
        </div>
        <div style={{ marginTop: '2rem' }}>
          <h3 style={{ fontSize: '1.2rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1rem' }}>Meilleures dates</h3>
          {best.length > 0 ? best.map(({ d, u }) => (
            <div key={d} style={{ display: 'flex', gap: '1rem', padding: '0.75rem', background: 'white', marginBottom: '0.5rem', alignItems: 'center' }}>
              <div style={{ fontWeight: 700, minWidth: 120 }}>{formatDate(d)}</div>
              <div style={{ flex: 1, display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>{u.map(x => <span key={x} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '0.2rem 0.5rem', background: 'rgba(0,0,0,0.1)', fontWeight: 700, fontSize: '0.85rem' }}><span style={{ width: 8, height: 8, borderRadius: '50%', background: getMember(x).color }}></span>{getMember(x).name}</span>)}</div>
              <div style={{ fontWeight: 700, color: COLORS.red }}>{u.length}/5</div>
            </div>
          )) : <div style={{ color: COLORS.grey }}>Pas encore de disponibilités</div>}
        </div>
      </div>
    </section>
  );
};

// Membres
const MembresTab = ({ films }) => {
  const membersList = Object.entries(MEMBERS);
  const stats = (id) => ({ 
    prop: films.filter(f => f.proposedBy === id).length, 
    watched: films.filter(f => f.proposedBy === id && f.status === 'watched').length, 
    likes: films.filter(f => f.proposedBy === id).reduce((a, f) => a + (f.likes?.length || 0), 0) 
  });
  const watched = films.filter(f => f.status === 'watched');
  const bestP = membersList.map(([k, m]) => ({ ...m, id: k, w: watched.filter(f => f.proposedBy === k).length })).sort((a, b) => b.w - a.w)[0];
  const mostActive = membersList.map(([k, m]) => ({ ...m, id: k, v: films.filter(f => f.likes?.includes(k)).length })).sort((a, b) => b.v - a.v)[0];

  return (
    <section style={{ background: COLORS.cream, padding: '2rem' }}>
      <div style={{ maxWidth: '90vw', margin: '0 auto' }}>
        <h2 style={{ fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1.5rem' }}>Statistiques</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: '1rem' }}>
          {membersList.map(([k, m]) => { const s = stats(k); return (
            <div key={k} style={{ background: 'white', padding: '1.5rem', textAlign: 'center' }}>
              <div style={{ width: 60, height: 60, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 700, fontSize: '1.5rem', margin: '0 auto 1rem', background: m.color }}>{m.name[0]}</div>
              <div style={{ fontWeight: 700, fontSize: '1.1rem', marginBottom: '0.5rem' }}>{m.name}</div>
              <div style={{ color: COLORS.grey, fontSize: '0.9rem', lineHeight: 1.6 }}>{s.prop} proposé{s.prop > 1 ? 's' : ''}<br/>{s.watched} vu{s.watched > 1 ? 's' : ''}<br/>{s.likes} ★ reçues</div>
            </div>
          ); })}
        </div>
        <div style={{ marginTop: '2rem' }}>
          <h3 style={{ fontSize: '1.2rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1rem' }}>Hall of Fame</h3>
          <div style={{ display: 'grid', gap: '1rem', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))' }}>
            <div style={{ background: 'white', padding: '1.5rem', textAlign: 'center' }}><div style={{ fontSize: '1.5rem', marginBottom: '0.5rem' }}>🎬</div><div style={{ fontWeight: 700, marginBottom: '0.5rem' }}>Meilleur goût</div><div style={{ color: COLORS.grey }}>{bestP?.w > 0 ? <><span style={{ color: bestP.color }}>{bestP.name}</span><br/>{bestP.w} film{bestP.w > 1 ? 's' : ''} vu{bestP.w > 1 ? 's' : ''}</> : '—'}</div></div>
            <div style={{ background: 'white', padding: '1.5rem', textAlign: 'center' }}><div style={{ fontSize: '1.5rem', marginBottom: '0.5rem' }}>⚡</div><div style={{ fontWeight: 700, marginBottom: '0.5rem' }}>Plus actif</div><div style={{ color: COLORS.grey }}>{mostActive?.v > 0 ? <><span style={{ color: mostActive.color }}>{mostActive.name}</span><br/>{mostActive.v} like{mostActive.v > 1 ? 's' : ''}</> : '—'}</div></div>
          </div>
        </div>
      </div>
    </section>
  );
};

            <div><div style={{ fontSize: '1.8rem', fontWeight: 700, lineHeight: 1.1, marginBottom: '0.5rem' }}>{film.title}</div><div style={{ color: COLORS.grey, marginBottom: '0.75rem' }}>{film.year} · {film.director}{film.runtime ? ` · ${film.runtime} min` : ''}</div><div style={{ display: 'inline-block', padding: '0.3rem 0.8rem', color: 'white', fontWeight: 700, fontSize: '0.85rem', background: p.color }}>Proposé par {p.name}</div></div>
          </div>
          {film.overview && <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>Synopsis</div><div style={{ lineHeight: 1.6 }}>{film.overview}</div></div>}

          {film.actors && <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>Casting</div><div style={{ lineHeight: 1.6 }}>{film.actors}</div></div>}
          {film.status !== 'watched' && (
            <div style={{ marginBottom: '1.5rem' }}>
              <div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>★ Likes ({film.likes?.length || 0})</div>
              {film.likes?.length > 0 ? (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                  {film.likes.map(v => (
                    <span key={v} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '0.3rem 0.8rem', background: 'rgba(0,0,0,0.1)', fontWeight: 700, fontSize: '0.9rem' }}>

                      {getMember(v).name}

          {showDate && <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>Date de visionnage</div><div style={{ display: 'flex', gap: '0.5rem' }}><input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ padding: '0.5rem', border: `2px solid ${COLORS.black}`, fontFamily: 'inherit' }} /><button className="btn" onClick={() => onWatched(date)}>Valider</button></div></div>}
        </div>
        <div className="modal-actions">
          {film.status === 'proposed' && (
            <>
              <button 
                className={`btn ${isLiked ? '' : 'btn-outline'}`} 
                onClick={onLike}
                disabled={!canLike}
                style={{ opacity: canLike ? 1 : 0.5 }}
              >
                {isLiked ? '★ Liké' : '☆ Liker'}
              </button>
              <button className="btn" onClick={onSchedule}>Programmer</button>
            </>
          )}
          {film.status === 'scheduled' && <><button className="btn btn-outline" onClick={onUnschedule}>Déprogrammer</button><button className="btn" onClick={() => setShowDate(true)}>Marquer vu</button></>}
          {(isProposer || film.status === 'watched') && <button className="btn" style={{ background: '#c62828' }} onClick={onDelete}>Supprimer</button>}
        </div>
      </div>
    </div>
  );
};

// Modal ajout
const AddModal = ({ onClose, onAdd }) => {
  const [q, setQ] = React.useState('');
  const [results, setResults] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const search = async () => { if (!q.trim()) return; setLoading(true); try { const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=fr-FR&query=${encodeURIComponent(q)}`); const data = await res.json(); setResults(data.results?.slice(0, 10) || []); } catch(e) { console.error(e); } setLoading(false); };
  const select = async (r) => { try { const [det, cred] = await Promise.all([fetch(`https://api.themoviedb.org/3/movie/${r.id}?api_key=${TMDB_KEY}&language=fr-FR`).then(x => x.json()), fetch(`https://api.themoviedb.org/3/movie/${r.id}/credits?api_key=${TMDB_KEY}`).then(x => x.json())]); onAdd({ tmdbId: r.id, title: det.title, year: det.release_date?.split('-')[0] || '', poster: det.poster_path ? TMDB_IMG + det.poster_path : null, director: cred.crew?.find(c => c.job === 'Director')?.name || '', actors: cred.cast?.slice(0, 4).map(a => a.name).join(', ') || '', genres: det.genres?.map(g => g.name).join(', ') || '', overview: det.overview || '', runtime: det.runtime || 0 }); } catch(e) { console.error(e); } };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><div style={{ fontWeight: 700, fontSize: '1.2rem' }}>Proposer un film</div><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}><input className="search-box" placeholder="Titre du film..." value={q} onChange={e => setQ(e.target.value)} onKeyPress={e => e.key === 'Enter' && search()} autoFocus style={{ flex: 1 }} /><button className="btn" onClick={search}>{loading ? '...' : 'Chercher'}</button></div>
          {results.length > 0 && <div className="search-results">{results.map(r => (<div key={r.id} className="search-result" onClick={() => select(r)}>{r.poster_path ? <img src={TMDB_IMG + r.poster_path} alt="" /> : <div style={{ width: 50, height: 75, background: COLORS.black, display: 'flex', alignItems: 'center', justifyContent: 'center', color: COLORS.cream }}>?</div>}<div><div style={{ fontWeight: 700 }}>{r.title}</div><div style={{ color: COLORS.grey, fontSize: '0.9rem' }}>{r.release_date?.split('-')[0] || '?'}{r.vote_average > 0 && ` · ⭐ ${r.vote_average.toFixed(1)}`}</div></div></div>))}</div>}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
