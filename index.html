// Sticker étoile 12 branches
const generateStarPath = (cx, cy, outerR, innerR, points) => {
  let path = '';
  for (let i = 0; i < points * 2; i++) {
    const angle = (i * Math.PI) / points - Math.PI / 2;
    const r = i % 2 === 0 ? outerR : innerR;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    path += (i === 0 ? 'M' : 'L') + x + ',' + y;
  }
  return path + 'Z';
};

const STICKER_POS = [
  { top: '12%', right: '6%', rot: -15 },
  { top: '38%', right: '4%', rot: 10 },
  { top: '60%', right: '8%', rot: -8 },
  { top: '25%', right: '12%', rot: 18 },
  { top: '50%', right: '2%', rot: -20 },
];

const VoteSticker = ({ memberId, index }) => {
  const m = getMember(memberId);
  const p = STICKER_POS[index % STICKER_POS.length];
  const rot = p.rot + (index * 13) % 25 - 12;
  const star = generateStarPath(20, 20, 20, 15, 12);
  return (
    <div style={{ position: 'absolute', top: p.top, right: p.right, transform: `rotate(${rot}deg)`, zIndex: 20 + index, pointerEvents: 'none' }}>
      <svg width="40" height="40" viewBox="0 0 40 40" style={{ filter: 'drop-shadow(1px 1px 1px rgba(0,0,0,0.4))' }}>

    </div>
  );
};

// App principale
const App = () => {
  const [user, setUser] = React.useState(() => localStorage.getItem('vd_user') || 'seb');
  const [tab, setTab] = React.useState('propositions');
  const [films, setFilms] = React.useState(() => { try { return JSON.parse(localStorage.getItem('vd_films')) || []; } catch { return []; } });
  const [avail, setAvail] = React.useState(() => { try { return JSON.parse(localStorage.getItem('vd_avail')) || {}; } catch { return {}; } });
  const [search, setSearch] = React.useState('');
  const [sort, setSort] = React.useState('votes');
  const [selected, setSelected] = React.useState(null);
  const [showAdd, setShowAdd] = React.useState(false);
  const [loading, setLoading] = React.useState(true);
  const [syncing, setSyncing] = React.useState(false);
  const [toast, setToast] = React.useState(null);

  React.useEffect(() => { localStorage.setItem('vd_user', user); }, [user]);
  React.useEffect(() => { localStorage.setItem('vd_films', JSON.stringify(films)); }, [films]);
  React.useEffect(() => { localStorage.setItem('vd_avail', JSON.stringify(avail)); }, [avail]);
  React.useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    if (!SHEETS_API || SHEETS_API === 'COLLE_TON_URL_ICI') { setLoading(false); return; }
    setSyncing(true);
    try {
      const res = await fetch(SHEETS_API);
      const data = await res.json();
      if (data.films) setFilms(data.films.map(f => ({ ...f, id: parseInt(f.id) || f.id, year: parseInt(f.year) || 0, votes: f.votes ? (typeof f.votes === 'string' ? JSON.parse(f.votes) : f.votes) : [], favorites: f.favorites ? (typeof f.favorites === 'string' ? JSON.parse(f.favorites) : f.favorites) : [] })));
      if (data.availabilities) setAvail(data.availabilities);
      notify('Données synchronisées');
    } catch(e) { console.error(e); }
    setSyncing(false);
    setLoading(false);
  };

  const save = async (f, a) => {
    if (!SHEETS_API || SHEETS_API === 'COLLE_TON_URL_ICI') return;
    setSyncing(true);
    try { await fetch(SHEETS_API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ films: f || films, availabilities: a || avail }) }); } catch(e) { console.error(e); }
    setSyncing(false);
  };

  const scheduled = films.find(f => f.status === 'scheduled');
  const proposed = films.filter(f => f.status === 'proposed');
  const watched = films.filter(f => f.status === 'watched').sort((a, b) => new Date(b.watchedDate) - new Date(a.watchedDate));

  const filtered = React.useMemo(() => {
    let r = [...proposed];
    if (search) { const q = search.toLowerCase(); r = r.filter(f => f.title?.toLowerCase().includes(q) || f.director?.toLowerCase().includes(q)); }
    switch(sort) {
      case 'favorites': return r.sort((a, b) => (b.favorites?.length || 0) - (a.favorites?.length || 0));
      case 'votes': return r.sort((a, b) => (b.votes?.length || 0) - (a.votes?.length || 0));
      case 'recent': return r.sort((a, b) => b.id - a.id);
      case 'year': return r.sort((a, b) => b.year - a.year);
      case 'alpha': return r.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'fr'));
      default: return r;
    }
  }, [proposed, search, sort]);

  const topVotes = [...proposed].sort((a, b) => (b.votes?.length || 0) - (a.votes?.length || 0)).slice(0, 3);
  const notify = (msg) => setToast(msg);

  const add = (film) => {
    const nf = { ...film, id: Date.now(), proposedBy: user, proposedDate: new Date().toISOString(), status: 'proposed', votes: [], favorites: [] };
    const newFilms = [nf, ...films];
    setFilms(newFilms); save(newFilms); setShowAdd(false);
    notify(`"${film.title}" ajouté`);
  };

  const vote = (id) => {
    const newFilms = films.map(f => f.id !== id ? f : { ...f, votes: (f.votes || []).includes(user) ? f.votes.filter(v => v !== user) : [...(f.votes || []), user] });
    setFilms(newFilms); save(newFilms);
    if (selected?.id === id) setSelected(newFilms.find(f => f.id === id));
  };

  const fav = (id) => {
    const newFilms = films.map(f => f.id !== id ? f : { ...f, favorites: (f.favorites || []).includes(user) ? f.favorites.filter(v => v !== user) : [...(f.favorites || []), user] });
    setFilms(newFilms); save(newFilms);
    if (selected?.id === id) setSelected(newFilms.find(f => f.id === id));
  };

  const schedule = (id) => {
    const newFilms = films.map(f => ({ ...f, status: f.id === id ? 'scheduled' : (f.status === 'scheduled' ? 'proposed' : f.status) }));
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film programmé !');
  };

  const unschedule = (id) => {
    const newFilms = films.map(f => f.id === id ? { ...f, status: 'proposed' } : f);
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film déprogrammé');
  };

  const markWatched = (id, date) => {
    const newFilms = films.map(f => f.id === id ? { ...f, status: 'watched', watchedDate: date || new Date().toISOString() } : f);
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film vu !');
  };

  const del = (id) => {
    if (!confirm('Supprimer ce film ?')) return;
    const newFilms = films.filter(f => f.id !== id);
    setFilms(newFilms); save(newFilms); setSelected(null);
    notify('Film supprimé');
  };

  const toggleAvail = (date) => {
    const k = date.toISOString().split('T')[0];
    const cur = avail[k] || [];
    const newAvail = { ...avail, [k]: cur.includes(user) ? cur.filter(u => u !== user) : [...cur, user] };
    setAvail(newAvail); save(null, newAvail);
  };

  if (loading) return <div className="loading-screen"><div className="loading-logo">VIDEODROME</div></div>;

  const membersList = Object.entries(MEMBERS);
  const placeholdersCount = Math.max(0, 6 - filtered.length);

  return (
    <div>
      {/* Header */}
      <header style={{ background: COLORS.black, padding: '1.5rem 2rem', position: 'sticky', top: 0, zIndex: 100 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
            <div style={{ display: 'flex', gap: 2, height: 38, width: '3.8rem' }}>
              {membersList.map(([k, m]) => <div key={k} style={{ flex: 1, height: '100%', background: m.color }}></div>)}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column' }}>
              <LogoSVG />
              <span style={{ fontSize: '0.65rem', color: COLORS.cream, letterSpacing: '0.3em', alignSelf: 'flex-end', marginTop: 2 }}>CLUB</span>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem' }}>
            <select value={user} onChange={e => setUser(e.target.value)} style={{ background: 'transparent', border: `2px solid ${COLORS.cream}`, color: COLORS.cream, padding: '0.5rem 1rem', fontFamily: 'inherit', fontWeight: 700, cursor: 'pointer' }}>
              {membersList.map(([k, m]) => <option key={k} value={k} style={{ background: COLORS.black }}>{m.name}</option>)}
            </select>
            <div style={{ color: COLORS.grey, fontSize: '0.9rem' }}>{proposed.length} films · {watched.length} vus{syncing && <span className="sync-icon"> ⟳</span>}</div>
          </div>
        </div>
        {/* Tabs */}
        <div style={{ display: 'flex', gap: 0, marginTop: '1rem', maxWidth: 1200, marginLeft: 'auto', marginRight: 'auto' }}>
          {[['propositions', 'Propositions', proposed.length], ['planning', 'Planning', 0], ['historique', 'Historique', watched.length], ['membres', 'Membres', 0]].map(([k, label, count]) => (
            <button key={k} onClick={() => setTab(k)} style={{ background: 'transparent', border: 'none', color: tab === k ? COLORS.cream : COLORS.grey, fontFamily: 'inherit', fontWeight: 700, fontSize: '0.9rem', padding: '0.75rem 1.5rem', cursor: 'pointer', position: 'relative' }}>
              {label}{count > 0 && <span style={{ background: COLORS.red, color: COLORS.cream, fontSize: '0.7rem', padding: '0.15rem 0.5rem', marginLeft: '0.5rem', borderRadius: 10 }}>{count}</span>}
              {tab === k && <div style={{ position: 'absolute', bottom: 0, left: '1rem', right: '1rem', height: 3, background: COLORS.red }}></div>}
            </button>
          ))}
        </div>
      </header>

      {tab === 'propositions' && (
        <>
          {/* Hero - Prochaine séance */}
          <section style={{ background: COLORS.cream, padding: '2rem' }}>
            <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', gap: '2rem', alignItems: 'flex-start' }}>
              <div style={{ width: 140, height: 210, background: '#000', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden', cursor: scheduled ? 'pointer' : 'default' }} onClick={() => scheduled && setSelected(scheduled)}>
                {scheduled ? (
                  scheduled.poster ? <img src={scheduled.poster} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <VHSPoster title={scheduled.title} />
                ) : (
                  <div style={{ width: '100%', height: '100%', background: 'linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column' }}>
                    <div style={{ fontSize: '4rem', opacity: 0.3, color: '#fff' }}>?</div>
                    <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 4, background: `repeating-linear-gradient(90deg, ${COLORS.red} 0px, ${COLORS.red} 8px, transparent 8px, transparent 16px)` }}></div>
                  </div>
                )}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'inline-block', background: COLORS.red, color: COLORS.cream, fontSize: '0.7rem', fontWeight: 700, letterSpacing: '0.1em', padding: '0.4rem 0.8rem', transform: 'rotate(-3deg)', marginBottom: '1rem' }}>PROCHAINE SÉANCE</div>
                {scheduled ? (
                  <>
                    <h1 style={{ fontSize: '2.5rem', fontWeight: 700, textTransform: 'uppercase', lineHeight: 0.85, marginBottom: '0.5rem' }}>{scheduled.title}</h1>
                    <div style={{ fontSize: '1.3rem', color: COLORS.grey, marginBottom: '1.5rem' }}>{scheduled.year} · {scheduled.director}</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}><span style={{ width: 12, height: 12, borderRadius: '50%', background: getMember(scheduled.proposedBy).color }}></span><span style={{ fontWeight: 700 }}>Proposé par {getMember(scheduled.proposedBy).name}</span></div>
                  </>
                ) : (
                  <>
                    <h1 style={{ fontSize: '2.5rem', fontWeight: 700, textTransform: 'uppercase', lineHeight: 0.85, marginBottom: '0.5rem', opacity: 0.3 }}>EN ATTENTE</h1>
                    <div style={{ fontSize: '1.3rem', color: COLORS.grey, marginBottom: '1.5rem', opacity: 0.5 }}>Aucun film programmé</div>
                    <div style={{ opacity: 0.5, fontStyle: 'italic' }}>Programmez un film depuis les propositions</div>
                  </>
                )}
              </div>
            </div>
          </section>

          {/* Section Top Votes */}
          <section style={{ background: COLORS.red, padding: '2rem 2rem 3rem', position: 'relative', zIndex: 20, overflow: 'visible' }}>
            <TornEdge color={COLORS.cream} height={8} />
            <div style={{ position: 'absolute', top: 0, left: 0, right: 0 }}><TornEdge color={COLORS.cream} height={8} /></div>
            <div style={{ maxWidth: 1200, margin: '0 auto', paddingTop: '1rem' }}>
              <h2 style={{ color: COLORS.cream, fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1.5rem' }}>Top votes</h2>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '2rem' }}>
                {topVotes.length > 0 ? topVotes.map((f, i) => <VHSCard key={f.id} film={f} index={i} onClick={() => setSelected(f)} onFav={() => fav(f.id)} user={user} />) : [...Array(3)].map((_, i) => <VHSPlaceholder key={i} index={i} onClick={() => setShowAdd(true)} />)}
              </div>
            </div>
            <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, transform: 'scaleY(-1)' }}><TornEdge color={COLORS.cream} height={8} /></div>
          </section>

          {/* Section Propositions */}
          <section style={{ background: COLORS.cream, padding: '2rem', position: 'relative', zIndex: 30 }}>
            <div style={{ maxWidth: 1200, margin: '0 auto' }}>
              <div style={{ display: 'flex', gap: '1rem', marginBottom: '2rem', flexWrap: 'wrap', alignItems: 'center' }}>
                <input className="search-box" placeholder="Rechercher un film..." value={search} onChange={e => setSearch(e.target.value)} />
                <select value={sort} onChange={e => setSort(e.target.value)} style={{ padding: '0.75rem 1rem', border: `2px solid ${COLORS.black}`, background: COLORS.cream, fontFamily: 'inherit', fontWeight: 700 }}>
                  <option value="votes">▲ Votes</option>
                  <option value="favorites">♥ Favoris</option>
                  <option value="recent">Récents</option>
                  <option value="year">Année</option>
                  <option value="alpha">A → Z</option>
                </select>
                <button className="btn" onClick={() => setShowAdd(true)}>+ Proposer</button>
              </div>
              <h2 style={{ fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1.5rem' }}>Propositions ({filtered.length})</h2>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '2rem' }}>
                {filtered.map((f, i) => <VHSCard key={f.id} film={f} index={i} onClick={() => setSelected(f)} onFav={() => fav(f.id)} user={user} />)}
                {[...Array(placeholdersCount)].map((_, i) => <VHSPlaceholder key={`p-${i}`} index={filtered.length + i} onClick={() => setShowAdd(true)} />)}
              </div>
            </div>
          </section>
        </>
      )}

      {tab === 'planning' && <Planning avail={avail} user={user} onToggle={toggleAvail} />}
      {tab === 'historique' && <Historique watched={watched} onSelect={setSelected} />}
      {tab === 'membres' && <MembresTab films={films} />}

      {showAdd && <AddModal onClose={() => setShowAdd(false)} onAdd={add} />}
      {selected && <DetailModal film={selected} user={user} onClose={() => setSelected(null)} onVote={() => vote(selected.id)} onFav={() => fav(selected.id)} onSchedule={() => schedule(selected.id)} onUnschedule={() => unschedule(selected.id)} onWatched={(d) => markWatched(selected.id, d)} onDelete={() => del(selected.id)} />}
      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
};

// Planning
const Planning = ({ avail, user, onToggle }) => {
  const [month, setMonth] = React.useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });
  const today = new Date(); today.setHours(0,0,0,0);
  const dim = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
  const first = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
  const offset = first === 0 ? 6 : first - 1;
  const days = [...Array(offset).fill(null), ...Array.from({length: dim}, (_, i) => new Date(month.getFullYear(), month.getMonth(), i + 1))];
  const mName = month.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  const best = Object.entries(avail).filter(([d]) => new Date(d) >= today).map(([d, u]) => ({ d, u, c: u.length })).sort((a, b) => b.c - a.c).slice(0, 5);

  return (
    <section style={{ background: COLORS.cream, padding: '2rem' }}>
      <div style={{ maxWidth: 800, margin: '0 auto' }}>
        <h2 style={{ fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1.5rem' }}>Tes disponibilités</h2>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
          <button className="btn btn-outline" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))}>←</button>
          <div style={{ fontWeight: 700, fontSize: '1.1rem', textTransform: 'capitalize' }}>{mName}</div>
          <button className="btn btn-outline" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))}>→</button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, background: 'white', padding: '1rem' }}>
          {['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d => <div key={d} style={{ textAlign: 'center', fontWeight: 700, fontSize: '0.8rem', color: COLORS.grey, padding: '0.5rem' }}>{d}</div>)}
          {days.map((date, i) => { if (!date) return <div key={`e${i}`} />; const k = date.toISOString().split('T')[0]; const members = avail[k] || []; const isA = members.includes(user); const past = date < today; return <div key={k} onClick={() => !past && onToggle(date)} style={{ aspectRatio: '1', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: past ? 'default' : 'pointer', border: '2px solid transparent', background: isA ? COLORS.red : 'transparent', color: isA ? COLORS.cream : COLORS.black, opacity: past ? 0.3 : 1 }}><div style={{ fontWeight: 700 }}>{date.getDate()}</div>{members.length > 0 && <div style={{ fontSize: '0.7rem', opacity: 0.8 }}>{members.length}</div>}</div>; })}
        </div>
        <div style={{ marginTop: '2rem' }}>
          <h3 style={{ fontSize: '1.2rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1rem' }}>Meilleures dates</h3>
          {best.length > 0 ? best.map(({ d, u }) => (
            <div key={d} style={{ display: 'flex', gap: '1rem', padding: '0.75rem', background: 'white', marginBottom: '0.5rem', alignItems: 'center' }}>
              <div style={{ fontWeight: 700, minWidth: 120 }}>{formatDate(d)}</div>
              <div style={{ flex: 1, display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>{u.map(x => <span key={x} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '0.2rem 0.5rem', background: 'rgba(0,0,0,0.1)', fontWeight: 700, fontSize: '0.85rem' }}><span style={{ width: 8, height: 8, borderRadius: '50%', background: getMember(x).color }}></span>{getMember(x).name}</span>)}</div>
              <div style={{ fontWeight: 700, color: COLORS.red }}>{u.length}/5</div>
            </div>
          )) : <div style={{ color: COLORS.grey }}>Pas encore de disponibilités</div>}
        </div>
      </div>
    </section>
  );
};

// Historique
const Historique = ({ watched, onSelect }) => (
  <section style={{ background: COLORS.cream, padding: '2rem' }}>
    <div style={{ maxWidth: 1200, margin: '0 auto' }}>
      <h2 style={{ fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1.5rem' }}>Films vus ({watched.length})</h2>
      {watched.length > 0 ? watched.map(f => (
        <div key={f.id} onClick={() => onSelect(f)} style={{ display: 'flex', gap: '1rem', padding: '1rem', background: 'white', marginBottom: '0.5rem', cursor: 'pointer' }}>
          {f.poster ? <img src={f.poster} alt="" style={{ width: 60, height: 90, objectFit: 'cover' }} /> : <div style={{ width: 60, height: 90, background: COLORS.black, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.5rem' }}>📼</div>}
          <div style={{ flex: 1 }}><div style={{ fontWeight: 700, fontSize: '1.1rem' }}>{f.title}</div><div style={{ color: COLORS.grey }}>{f.year} · {f.director}</div><div style={{ color: COLORS.grey }}>Proposé par {getMember(f.proposedBy).name}</div></div>
          <div style={{ color: COLORS.grey }}>{formatDate(f.watchedDate)}</div>
        </div>
      )) : <div style={{ textAlign: 'center', padding: '3rem', color: COLORS.grey }}><div style={{ fontSize: '3rem', marginBottom: '1rem' }}>🎬</div>Aucun film vu</div>}
    </div>
  </section>
);

// Membres
const MembresTab = ({ films }) => {
  const membersList = Object.entries(MEMBERS);
  const stats = (id) => ({ prop: films.filter(f => f.proposedBy === id).length, watched: films.filter(f => f.proposedBy === id && f.status === 'watched').length, favs: films.filter(f => f.proposedBy === id).reduce((a, f) => a + (f.favorites?.length || 0), 0) });
  const watched = films.filter(f => f.status === 'watched');
  const bestP = membersList.map(([k, m]) => ({ ...m, id: k, w: watched.filter(f => f.proposedBy === k).length })).sort((a, b) => b.w - a.w)[0];
  const mostActive = membersList.map(([k, m]) => ({ ...m, id: k, v: films.filter(f => f.votes?.includes(k)).length })).sort((a, b) => b.v - a.v)[0];

  return (
    <section style={{ background: COLORS.cream, padding: '2rem' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <h2 style={{ fontSize: '1.5rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1.5rem' }}>Statistiques</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: '1rem' }}>
          {membersList.map(([k, m]) => { const s = stats(k); return (
            <div key={k} style={{ background: 'white', padding: '1.5rem', textAlign: 'center' }}>
              <div style={{ width: 60, height: 60, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 700, fontSize: '1.5rem', margin: '0 auto 1rem', background: m.color }}>{m.name[0]}</div>
              <div style={{ fontWeight: 700, fontSize: '1.1rem', marginBottom: '0.5rem' }}>{m.name}</div>
              <div style={{ color: COLORS.grey, fontSize: '0.9rem', lineHeight: 1.6 }}>{s.prop} proposé{s.prop > 1 ? 's' : ''}<br/>{s.watched} vu{s.watched > 1 ? 's' : ''}<br/>{s.favs} ♥ reçus</div>
            </div>
          ); })}
        </div>
        <div style={{ marginTop: '2rem' }}>
          <h3 style={{ fontSize: '1.2rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '1rem' }}>Hall of Fame</h3>
          <div style={{ display: 'grid', gap: '1rem', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))' }}>
            <div style={{ background: 'white', padding: '1.5rem', textAlign: 'center' }}><div style={{ fontSize: '1.5rem', marginBottom: '0.5rem' }}>🎬</div><div style={{ fontWeight: 700, marginBottom: '0.5rem' }}>Meilleur goût</div><div style={{ color: COLORS.grey }}>{bestP?.w > 0 ? <><span style={{ color: bestP.color }}>{bestP.name}</span><br/>{bestP.w} film{bestP.w > 1 ? 's' : ''} vu{bestP.w > 1 ? 's' : ''}</> : '—'}</div></div>
            <div style={{ background: 'white', padding: '1.5rem', textAlign: 'center' }}><div style={{ fontSize: '1.5rem', marginBottom: '0.5rem' }}>⚡</div><div style={{ fontWeight: 700, marginBottom: '0.5rem' }}>Plus actif</div><div style={{ color: COLORS.grey }}>{mostActive?.v > 0 ? <><span style={{ color: mostActive.color }}>{mostActive.name}</span><br/>{mostActive.v} vote{mostActive.v > 1 ? 's' : ''}</> : '—'}</div></div>
          </div>
        </div>
      </div>
    </section>
  );
};

// Modal détails
const DetailModal = ({ film, user, onClose, onVote, onFav, onSchedule, onUnschedule, onWatched, onDelete }) => {
  const voted = film.votes?.includes(user);
  const faved = film.favorites?.includes(user);
  const isProposer = film.proposedBy === user;
  const p = getMember(film.proposedBy);
  const [showDate, setShowDate] = React.useState(false);
  const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><div style={{ fontWeight: 700, fontSize: '1.2rem' }}>Détails</div><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div style={{ display: 'flex', gap: '1.5rem', marginBottom: '1.5rem' }}>
            <div style={{ width: 120, flexShrink: 0 }}>{film.poster ? <img src={film.poster} alt="" style={{ width: '100%' }} /> : <div style={{ width: '100%', aspectRatio: '2/3', background: COLORS.black, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '2rem' }}>📼</div>}</div>
            <div><div style={{ fontSize: '1.8rem', fontWeight: 700, lineHeight: 1.1, marginBottom: '0.5rem' }}>{film.title}</div><div style={{ color: COLORS.grey, marginBottom: '0.75rem' }}>{film.year} · {film.director}{film.runtime ? ` · ${film.runtime} min` : ''}</div><div style={{ display: 'inline-block', padding: '0.3rem 0.8rem', color: 'white', fontWeight: 700, fontSize: '0.85rem', background: p.color }}>Proposé par {p.name}</div></div>
          </div>
          {film.overview && <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>Synopsis</div><div style={{ lineHeight: 1.6 }}>{film.overview}</div></div>}
          {film.genres && <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>Genres</div><div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>{film.genres.split(',').map((g, i) => <span key={i} style={{ background: COLORS.black, color: COLORS.cream, padding: '0.25rem 0.75rem', fontSize: '0.85rem' }}>{g.trim()}</span>)}</div></div>}
          {film.actors && <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>Casting</div><div style={{ lineHeight: 1.6 }}>{film.actors}</div></div>}
          {film.status !== 'watched' && (
            <>
              <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>♥ Favoris ({film.favorites?.length || 0})</div>{film.favorites?.length > 0 ? <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>{film.favorites.map(v => <span key={v} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '0.3rem 0.8rem', background: 'rgba(0,0,0,0.1)', fontWeight: 700, fontSize: '0.9rem' }}><span style={{ width: 10, height: 10, borderRadius: '50%', background: getMember(v).color }}></span>{getMember(v).name}</span>)}</div> : <div style={{ color: COLORS.grey }}>—</div>}</div>
              <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>▲ Votes ({film.votes?.length || 0})</div>{film.votes?.length > 0 ? <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>{film.votes.map(v => <span key={v} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '0.3rem 0.8rem', background: 'rgba(0,0,0,0.1)', fontWeight: 700, fontSize: '0.9rem' }}><span style={{ width: 10, height: 10, borderRadius: '50%', background: getMember(v).color }}></span>{getMember(v).name}</span>)}</div> : <div style={{ color: COLORS.grey }}>—</div>}</div>
            </>
          )}
          <div style={{ display: 'flex', gap: '0.75rem', marginBottom: '1.5rem' }}>{film.tmdbId && <a href={`https://www.themoviedb.org/movie/${film.tmdbId}`} target="_blank" style={{ background: COLORS.black, color: COLORS.cream, padding: '0.5rem 1rem', textDecoration: 'none', fontWeight: 700, fontSize: '0.85rem' }}>TMDB</a>}<a href={`https://www.imdb.com/find/?q=${encodeURIComponent(film.title + ' ' + film.year)}`} target="_blank" style={{ background: COLORS.black, color: COLORS.cream, padding: '0.5rem 1rem', textDecoration: 'none', fontWeight: 700, fontSize: '0.85rem' }}>IMDb</a><a href={`https://www.justwatch.com/fr/recherche?q=${encodeURIComponent(film.title)}`} target="_blank" style={{ background: COLORS.black, color: COLORS.cream, padding: '0.5rem 1rem', textDecoration: 'none', fontWeight: 700, fontSize: '0.85rem' }}>JustWatch</a></div>
          {showDate && <div style={{ marginBottom: '1.5rem' }}><div style={{ fontWeight: 700, fontSize: '0.85rem', color: COLORS.grey, marginBottom: '0.5rem', textTransform: 'uppercase' }}>Date de visionnage</div><div style={{ display: 'flex', gap: '0.5rem' }}><input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ padding: '0.5rem', border: `2px solid ${COLORS.black}`, fontFamily: 'inherit' }} /><button className="btn" onClick={() => onWatched(date)}>Valider</button></div></div>}
        </div>
        <div className="modal-actions">
          {film.status === 'proposed' && <><button className={`btn ${faved ? '' : 'btn-outline'}`} onClick={onFav}>{faved ? '♥ Favori' : '♡ Favori'}</button><button className={`btn ${voted ? '' : 'btn-outline'}`} onClick={onVote}>{voted ? '✓ Voté' : '▲ Voter'}</button><button className="btn" onClick={onSchedule}>Programmer</button></>}
          {film.status === 'scheduled' && <><button className="btn btn-outline" onClick={onUnschedule}>Déprogrammer</button><button className="btn" onClick={() => setShowDate(true)}>Marquer vu</button></>}
          {(isProposer || film.status === 'watched') && <button className="btn" style={{ background: '#c62828' }} onClick={onDelete}>Supprimer</button>}
        </div>
      </div>
    </div>
  );
};

// Modal ajout
const AddModal = ({ onClose, onAdd }) => {
  const [q, setQ] = React.useState('');
  const [results, setResults] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const search = async () => { if (!q.trim()) return; setLoading(true); try { const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=fr-FR&query=${encodeURIComponent(q)}`); const data = await res.json(); setResults(data.results?.slice(0, 10) || []); } catch(e) { console.error(e); } setLoading(false); };
  const select = async (r) => { try { const [det, cred] = await Promise.all([fetch(`https://api.themoviedb.org/3/movie/${r.id}?api_key=${TMDB_KEY}&language=fr-FR`).then(x => x.json()), fetch(`https://api.themoviedb.org/3/movie/${r.id}/credits?api_key=${TMDB_KEY}`).then(x => x.json())]); onAdd({ tmdbId: r.id, title: det.title, year: det.release_date?.split('-')[0] || '', poster: det.poster_path ? TMDB_IMG + det.poster_path : null, director: cred.crew?.find(c => c.job === 'Director')?.name || '', actors: cred.cast?.slice(0, 4).map(a => a.name).join(', ') || '', genres: det.genres?.map(g => g.name).join(', ') || '', overview: det.overview || '', runtime: det.runtime || 0 }); } catch(e) { console.error(e); } };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><div style={{ fontWeight: 700, fontSize: '1.2rem' }}>Proposer un film</div><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}><input className="search-box" placeholder="Titre du film..." value={q} onChange={e => setQ(e.target.value)} onKeyPress={e => e.key === 'Enter' && search()} autoFocus style={{ flex: 1 }} /><button className="btn" onClick={search}>{loading ? '...' : 'Chercher'}</button></div>
          {results.length > 0 && <div className="search-results">{results.map(r => (<div key={r.id} className="search-result" onClick={() => select(r)}>{r.poster_path ? <img src={TMDB_IMG + r.poster_path} alt="" /> : <div style={{ width: 50, height: 75, background: COLORS.black, display: 'flex', alignItems: 'center', justifyContent: 'center', color: COLORS.cream }}>?</div>}<div><div style={{ fontWeight: 700 }}>{r.title}</div><div style={{ color: COLORS.grey, fontSize: '0.9rem' }}>{r.release_date?.split('-')[0] || '?'}{r.vote_average > 0 && ` · ⭐ ${r.vote_average.toFixed(1)}`}</div></div></div>))}</div>}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
