<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDEODROME — Ciné-Club Série B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e63946">
  <style>
    :root {
      --cream: #f5f0e6;
      --red: #e63946;
      --black: #1a1a1a;
      --grey: #888;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Fraunces', Georgia, serif;
      background: var(--cream);
      color: var(--black);
      min-height: 100vh;
    }
    
    .header {
      background: var(--black);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .logo-bands {
      display: flex;
      gap: 2px;
      height: 38px;
      width: 3.8rem;
    }
    
    .logo-band { flex: 1; height: 100%; }
    
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    
    .logo-svg {
      height: 38px;
      fill: var(--cream);
    }
    
    .logo-club {
      font-size: 0.65rem;
      color: var(--cream);
      letter-spacing: 0.3em;
      align-self: flex-end;
      margin-top: 2px;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    
    .user-select {
      background: transparent;
      border: 2px solid var(--cream);
      color: var(--cream);
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    
    .user-select option {
      background: var(--black);
      color: var(--cream);
    }
    
    .stats {
      color: var(--grey);
      font-size: 0.9rem;
    }
    
    .sync-icon {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    .tabs {
      display: flex;
      gap: 0;
      margin-top: 1rem;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .tab {
      background: transparent;
      border: none;
      color: var(--grey);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    
    .tab:hover { color: var(--cream); }
    .tab.active { color: var(--cream); }
    
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 1rem;
      right: 1rem;
      height: 3px;
      background: var(--red);
    }
    
    .tab-badge {
      background: var(--red);
      color: var(--cream);
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      margin-left: 0.5rem;
      border-radius: 10px;
    }
    
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .controls {
      display: flex;
      gap: 1rem;
      padding: 1rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 0.75rem 1rem;
      border: 2px solid var(--black);
      background: var(--cream);
      font-family: inherit;
      font-size: 1rem;
    }
    
    .search-box:focus {
      outline: none;
      border-color: var(--red);
    }
    
    select {
      padding: 0.75rem 1rem;
      border: 2px solid var(--black);
      background: var(--cream);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    
    .btn {
      background: var(--red);
      color: var(--cream);
      border: none;
      padding: 0.75rem 1.5rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .btn:hover { transform: scale(1.05); }
    
    .btn-outline {
      background: transparent;
      border: 2px solid var(--black);
      color: var(--black);
    }
    
    .btn-danger { background: #c62828; }
    
    .vhs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      padding: 1rem;
      perspective: 1000px;
    }
    
    .film-card {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: white;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .film-card:hover { transform: translateX(5px); }
    
    .film-poster {
      width: 60px;
      height: 90px;
      object-fit: cover;
      background: var(--black);
    }
    
    .film-poster-placeholder {
      width: 60px;
      height: 90px;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    
    .film-info { flex: 1; }
    
    .film-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }
    
    .film-meta {
      color: var(--grey);
      font-size: 0.9rem;
    }
    
    .hero {
      background: var(--cream);
      padding: 2rem;
    }
    
    .hero-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 3rem;
      align-items: flex-start;
    }
    
    .hero-sticker {
      display: inline-block;
      background: var(--red);
      color: var(--cream);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0.4rem 0.8rem;
      transform: rotate(-3deg);
      margin-bottom: 1rem;
    }
    
    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.85;
      margin-bottom: 0.5rem;
    }
    
    .hero-year {
      font-size: 1.5rem;
      color: var(--grey);
      margin-bottom: 2rem;
    }
    
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    
    .modal {
      background: var(--cream);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 2px solid var(--black);
    }
    
    .modal-title {
      font-weight: 700;
      font-size: 1.2rem;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }
    
    .modal-body { padding: 1.5rem; }
    
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      padding: 1.5rem;
      border-top: 2px solid var(--black);
      flex-wrap: wrap;
    }
    
    .detail-top {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .detail-poster {
      width: 120px;
      flex-shrink: 0;
    }
    
    .detail-poster img {
      width: 100%;
      display: block;
    }
    
    .detail-title {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    
    .detail-meta {
      color: var(--grey);
      margin-bottom: 0.75rem;
    }
    
    .detail-proposer {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
    }
    
    .detail-section { margin-bottom: 1.5rem; }
    
    .detail-section-title {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--grey);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .detail-text { line-height: 1.6; }
    
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .tag {
      background: var(--black);
      color: var(--cream);
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
    }
    
    .voters-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .voter-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      background: rgba(0,0,0,0.1);
      font-size: 0.9rem;
      font-weight: 700;
    }
    
    .voter-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    
    .links {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    
    .link-btn {
      background: var(--black);
      color: var(--cream);
      padding: 0.5rem 1rem;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
    }
    
    .search-results {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .search-result {
      display: flex;
      gap: 1rem;
      padding: 0.75rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    
    .search-result:hover { background: rgba(0,0,0,0.05); }
    
    .search-result img {
      width: 50px;
      height: 75px;
      object-fit: cover;
    }
    
    .result-noimg {
      width: 50px;
      height: 75px;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cream);
    }
    
    .result-title { font-weight: 700; }
    .result-meta { color: var(--grey); font-size: 0.9rem; }
    
    .suggestions { margin-top: 1.5rem; }
    
    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    
    .suggestion-card {
      text-decoration: none;
      color: inherit;
    }
    
    .suggestion-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }
    
    .suggestion-title {
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 0.3rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .calendar-month {
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: capitalize;
    }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: white;
      padding: 1rem;
    }
    
    .calendar-header {
      text-align: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--grey);
      padding: 0.5rem;
    }
    
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    
    .calendar-day:hover:not(.past) { border-color: var(--red); }
    .calendar-day.available { background: var(--red); color: var(--cream); }
    .calendar-day.past { opacity: 0.3; cursor: default; }
    .calendar-day-num { font-weight: 700; }
    .calendar-day-count { font-size: 0.7rem; opacity: 0.8; }
    
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
    }
    
    .member-card {
      background: white;
      padding: 1.5rem;
      text-align: center;
    }
    
    .member-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.5rem;
      margin: 0 auto 1rem;
    }
    
    .member-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    
    .member-stats {
      color: var(--grey);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--grey);
    }
    
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--black);
      color: var(--cream);
      padding: 1rem 2rem;
      font-weight: 700;
      z-index: 2000;
      animation: slideUp 0.3s ease;
    }
    
    .toast.error { background: #c62828; }
    
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    
    .loading-screen {
      position: fixed;
      inset: 0;
      background: var(--black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-logo {
      font-size: 3rem;
      font-weight: 700;
      color: var(--cream);
      animation: pulse 1.5s ease infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    @media (max-width: 768px) {
      .header-content { flex-direction: column; gap: 1rem; }
      .tabs { flex-wrap: wrap; justify-content: center; }
      .tab { padding: 0.5rem 1rem; font-size: 0.8rem; }
      .hero-content { flex-direction: column; }
      .hero-title { font-size: 2rem; }
      .controls { flex-direction: column; }
      .search-box { width: 100%; }
      .detail-top { flex-direction: column; align-items: center; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
