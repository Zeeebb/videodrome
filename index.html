<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE VIDEODROME CLUB</title>
  <meta name="theme-color" content="#e31c25">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --black: #000000;
      --dark: #0a0a0a;
      --gray: #1a1a1a;
      --gray-mid: #333;
      --red: #e31c25;
      --red-dark: #b8171e;
      --cream: #f5f0e6;
      --cream-dark: #e8e0d0;
      --white: #ffffff;
    }
    
    body { 
      font-family: 'Oswald', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER - Bande rouge style Rockyrama */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--red);
      border-bottom: 4px solid var(--black);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
    }
    .logo {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
    .logo-the {
      font-family: 'Special Elite', serif;
      font-size: 0.9rem;
      color: var(--black);
      letter-spacing: 0.1em;
      margin-left: 4px;
    }
    .logo-main {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 700;
      color: var(--black);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .logo-club {
      font-family: 'Oswald', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--white);
      letter-spacing: 0.3em;
      margin-left: 4px;
    }
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    .user-select {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.4rem 1rem;
      background: var(--black);
      border: none;
      color: var(--white);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .user-select:focus { outline: 2px solid var(--white); }
    .stats { 
      font-size: 0.85rem; 
      font-weight: 500;
      color: var(--black); 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
    }
    .sync-icon { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TABS - Fond noir, texte rouge */
    .tabs { 
      display: flex; 
      background: var(--black); 
      overflow-x: auto;
      border-bottom: 3px solid var(--red);
    }
    .tab {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      padding: 1rem 2rem;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      text-transform: uppercase;
      position: relative;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--white); }
    .tab.active { color: var(--red); }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0; right: 0;
      height: 3px;
      background: var(--white);
    }
    .tab-badge {
      font-size: 0.75rem;
      background: var(--red);
      color: var(--white);
      padding: 0.15rem 0.4rem;
      margin-left: 0.5rem;
    }

    /* CONTROLS - Alternance rouge */
    .controls {
      display: flex;
      gap: 1rem;
      padding: 1rem 2rem;
      background: var(--red);
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      padding: 0.6rem 1rem;
      background: var(--black);
      border: 3px solid var(--black);
      color: var(--white);
    }
    .search-box:focus { outline: none; background: var(--dark); }
    .search-box::placeholder { color: #666; }
    select {
      font-family: 'Oswald', sans-serif;
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
      background: var(--black);
      border: 3px solid var(--black);
      color: var(--white);
      cursor: pointer;
    }
    .btn {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.6rem 1.5rem;
      background: var(--black);
      border: 3px solid var(--black);
      color: var(--white);
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--white); color: var(--black); }
    .btn-red { background: var(--red); border-color: var(--red); color: var(--white); }
    .btn-red:hover { background: var(--red-dark); border-color: var(--red-dark); }
    .btn-outline { background: transparent; border: 3px solid var(--black); color: var(--black); }
    .btn-outline:hover { background: var(--black); color: var(--white); }

    /* MAIN */
    .main { padding: 2rem; min-height: 60vh; }
    .section-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--red);
      margin-bottom: 2rem;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 3px;
      background: var(--red);
    }
    .empty {
      text-align: center;
      padding: 4rem;
      color: #555;
      font-size: 1rem;
      border: 3px solid var(--gray);
    }

    /* FEATURED - Bande rouge */
    .featured {
      background: var(--red);
      border: 4px solid var(--black);
      margin-bottom: 3rem;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .featured:hover { transform: scale(1.01); }
    .featured-label {
      position: absolute;
      top: 0; left: 0;
      font-family: 'Oswald', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      background: var(--black);
      color: var(--white);
      padding: 0.5rem 1.5rem;
      text-transform: uppercase;
    }
    .featured-inner { display: flex; gap: 2rem; padding: 2rem; padding-top: 3rem; }
    .featured-poster { width: 140px; flex-shrink: 0; }
    .featured-poster img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border: 4px solid var(--black);
    }
    .featured-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .featured-title {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--black);
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    .featured-meta { color: var(--black); font-size: 1rem; font-weight: 500; margin-bottom: 1rem; opacity: 0.8; }
    .featured-proposer {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.8rem;
      background: var(--black);
      color: var(--white);
      text-transform: uppercase;
    }
    @media (max-width: 600px) {
      .featured-inner { flex-direction: column; align-items: center; text-align: center; }
      .featured-poster { width: 120px; }
    }

    /* VHS GRID */
    .vhs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      padding: 1rem;
    }
    
    .vhs-case {
      width: 150px;
      cursor: pointer;
    }
    
    .vhs-wrapper {
      position: relative;
    }
    
    /* Le boîtier VHS - style vintage crème */
    .vhs-sleeve {
      position: relative;
      background: var(--cream);
      border: 3px solid var(--black);
      padding: 8px 8px 40px 8px;
      box-shadow: 4px 4px 0 var(--black);
      transition: transform 0.3s ease;
    }
    
    /* Bande rouge en haut du boîtier */
    .vhs-sleeve::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 25px;
      background: var(--red);
      border-bottom: 2px solid var(--black);
    }
    
    .vhs-poster {
      position: relative;
      margin-top: 20px;
      border: 2px solid var(--black);
      overflow: hidden;
    }
    .vhs-poster img { 
      width: 100%; 
      aspect-ratio: 2/3; 
      object-fit: cover; 
      display: block;
      filter: saturate(0.9) contrast(1.05);
    }
    .vhs-noimg {
      width: 100%;
      aspect-ratio: 2/3;
      background: linear-gradient(135deg, #ddd 0%, #bbb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    
    /* Titre sur le boîtier */
    .vhs-sleeve-title {
      position: absolute;
      top: 3px;
      left: 8px;
      right: 8px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--black);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Zone infos en bas du boîtier */
    .vhs-sleeve-info {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
    }
    .vhs-sleeve-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--black);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vhs-sleeve-year {
      font-family: 'Special Elite', serif;
      font-size: 0.65rem;
      color: #666;
    }
    
    /* La cassette VHS qui sort */
    .vhs-tape {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 90%;
      height: 55px;
      background: var(--black);
      border: 2px solid #333;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: -1;
    }
    
    /* Fenêtre de la cassette */
    .vhs-tape::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 18px;
      background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
      border: 2px solid #222;
      border-radius: 2px;
    }
    
    /* Bobines */
    .vhs-tape::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 10px;
      background: 
        radial-gradient(circle at 25% 50%, #444 0%, #444 30%, transparent 30%),
        radial-gradient(circle at 75% 50%, #444 0%, #444 30%, transparent 30%);
    }
    
    /* Label sur la cassette */
    .vhs-tape-label {
      position: absolute;
      bottom: 4px;
      left: 5%;
      right: 5%;
      height: 20px;
      background: var(--cream);
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .vhs-tape-label span {
      font-family: 'Oswald', sans-serif;
      font-size: 0.5rem;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Animation au survol */
    .vhs-case:hover .vhs-sleeve {
      transform: translateY(-20px);
    }
    .vhs-case:hover .vhs-tape {
      opacity: 1;
      transform: translateX(-50%) translateY(5px);
    }
    
    /* Badges */
    .vhs-badges {
      position: absolute;
      top: 28px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 2;
    }
    .vhs-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      padding: 0.2rem 0.35rem;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vhs-badge.fav { background: var(--red); color: var(--white); }
    .vhs-badge.vote { background: var(--black); color: var(--white); }
    
    .vhs-proposer {
      position: absolute;
      top: 28px;
      left: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      z-index: 2;
    }
    
    .vhs-fav-btn {
      position: absolute;
      bottom: 45px;
      right: 12px;
      width: 26px;
      height: 26px;
      background: var(--white);
      border: 2px solid var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      z-index: 2;
    }
    .vhs-case:hover .vhs-fav-btn { opacity: 1; }
    .vhs-fav-btn:hover { background: var(--red); border-color: var(--red); }
    .vhs-fav-btn.active { opacity: 1; background: var(--red); border-color: var(--red); }

    /* MODAL */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal {
      background: var(--black);
      border: 4px solid var(--red);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--red);
    }
    .modal-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--black);
      text-transform: uppercase;
    }
    .modal-close { background: none; border: none; color: var(--black); font-size: 1.5rem; cursor: pointer; font-weight: bold; }
    .modal-close:hover { color: var(--white); }
    .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      background: var(--red);
      flex-wrap: wrap;
    }
    .modal-actions .btn { flex: 1; text-align: center; }

    .detail-top { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
    .detail-poster { width: 120px; flex-shrink: 0; }
    .detail-poster img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border: 3px solid var(--red);
    }
    .detail-info { flex: 1; }
    .detail-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      color: var(--red);
    }
    .detail-meta { color: #888; font-size: 0.9rem; }
    .detail-proposer {
      display: inline-block;
      margin-top: 0.75rem;
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 0.25rem 0.6rem;
      background: var(--red);
      color: var(--white);
      text-transform: uppercase;
    }
    .detail-section { margin-top: 1.5rem; }
    .detail-section-title {
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--red);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .detail-text { font-size: 0.9rem; line-height: 1.6; color: #ccc; font-family: 'Special Elite', serif; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag { font-size: 0.75rem; padding: 0.3rem 0.6rem; background: var(--gray); border: 2px solid var(--gray-mid); }
    .voters-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .voter-chip {
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.6rem;
      background: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .voter-chip.fav::before { content: '♥'; color: var(--red); }
    .voter-chip.vote::before { content: '▲'; color: var(--white); }
    .links { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .link-btn {
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.5rem 0.8rem;
      background: var(--gray);
      border: 2px solid var(--gray-mid);
      color: var(--white);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .link-btn:hover { border-color: var(--red); color: var(--red); }

    .search-results { display: flex; flex-direction: column; gap: 0.5rem; max-height: 300px; overflow-y: auto; margin: 1rem 0; }
    .search-result {
      display: flex;
      gap: 1rem;
      padding: 0.75rem;
      background: var(--dark);
      border: 3px solid var(--gray);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .search-result:hover { border-color: var(--red); }
    .search-result img { width: 50px; height: 75px; object-fit: cover; }
    .result-noimg { width: 50px; height: 75px; background: var(--gray); display: flex; align-items: center; justify-content: center; color: #555; }
    .result-title { font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 600; text-transform: uppercase; }
    .result-meta { font-size: 0.8rem; color: #888; }

    /* Calendar */
    .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .calendar-month { font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; }
    .calendar-header { font-family: 'Oswald', sans-serif; font-size: 0.85rem; font-weight: 600; color: var(--red); text-align: center; padding: 0.5rem; }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gray);
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .calendar-day:hover { border-color: var(--red); }
    .calendar-day.available { border-color: var(--red); background: rgba(227, 28, 37, 0.2); }
    .calendar-day.past { opacity: 0.3; pointer-events: none; }
    .calendar-day-num { font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 600; }
    .calendar-day-count { position: absolute; bottom: 2px; font-size: 0.6rem; color: var(--red); font-weight: 600; }

    /* History */
    .history-item {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: var(--dark);
      border: 3px solid var(--gray);
      margin-bottom: 0.75rem;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .history-item:hover { border-color: var(--red); }
    .history-poster { width: 50px; flex-shrink: 0; }
    .history-poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border: 2px solid var(--white); }
    .history-info { flex: 1; }
    .history-title { font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 600; text-transform: uppercase; }
    .history-meta { font-size: 0.8rem; color: #888; }
    .history-date { 
      font-family: 'Oswald', sans-serif; 
      font-size: 0.85rem; 
      font-weight: 600;
      letter-spacing: 0.1em; 
      padding: 0.4rem 0.8rem; 
      background: var(--red);
      color: var(--white);
    }

    /* Members */
    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .member-card { 
      background: var(--dark); 
      border: 3px solid var(--gray); 
      padding: 1.5rem 1rem; 
      text-align: center; 
      transition: border-color 0.2s; 
    }
    .member-card:hover { border-color: var(--red); }
    .member-avatar { 
      width: 60px; 
      height: 60px; 
      margin: 0 auto 1rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-family: 'Oswald', sans-serif; 
      font-size: 1.8rem; 
      font-weight: 700;
      color: var(--black); 
    }
    .member-name { 
      font-family: 'Oswald', sans-serif; 
      font-size: 1.1rem; 
      font-weight: 600;
      letter-spacing: 0.1em; 
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .member-stats { font-size: 0.8rem; color: #888; line-height: 1.6; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 0.75rem 2rem;
      background: var(--red);
      color: var(--white);
      border: 3px solid var(--black);
      z-index: 2000;
      animation: toastIn 0.3s ease;
      text-transform: uppercase;
    }
    .toast.error { background: var(--black); border-color: var(--red); }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* Loading */
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 2rem; background: var(--red); }
    .loading-logo { 
      font-family: 'Oswald', sans-serif; 
      font-size: 2.5rem; 
      font-weight: 700;
      letter-spacing: 0.1em; 
      color: var(--black); 
      animation: pulse 1.5s ease-in-out infinite; 
      text-transform: uppercase;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* Suggestions */
    .suggestions { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 3px solid var(--gray); }
    .suggestions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .suggestion-card { position: relative; border: 2px solid var(--gray); overflow: hidden; transition: border-color 0.2s; }
    .suggestion-card:hover { border-color: var(--red); }
    .suggestion-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .suggestion-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.5rem 0.4rem 0.3rem; background: linear-gradient(transparent, rgba(0,0,0,0.95)); }
    .suggestion-title { font-size: 0.6rem; font-weight: 500; }
  </style>
</head>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
