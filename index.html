<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDEODROME CLUB</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --black: #000000;
      --red: #fb1f29;
      --white: #ffffff;
      --gray: #1a1a1a;
    }
    
    body { 
      font-family: 'Fraunces', serif;
      font-weight: 700;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--black);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 1rem 2rem 0.5rem;
    }
    .logo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .logo-img {
      height: clamp(24px, 5vw, 36px);
      width: auto;
      filter: invert(22%) sepia(95%) saturate(5000%) hue-rotate(350deg) brightness(95%) contrast(100%);
    }
    .logo-club {
      font-family: 'Fraunces', serif;
      font-size: clamp(0.55rem, 1.5vw, 0.75rem);
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-left: 2px;
    }
    .header-right { 
      display: flex; 
      align-items: center; 
      gap: 1.5rem; 
      padding-bottom: 0.3rem;
    }
    .user-select {
      font-family: 'Fraunces', serif;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      background: var(--red);
      border: none;
      color: var(--black);
      cursor: pointer;
      text-transform: capitalize;
    }
    .user-select:focus { outline: 2px solid var(--white); }
    .stats { 
      font-size: 0.9rem; 
      font-weight: 700;
      color: var(--white); 
    }
    .sync-icon { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TABS */
    .tabs { 
      display: flex; 
      background: var(--black); 
      padding: 0 2rem;
      gap: 0;
      border-bottom: none;
    }
    .tab {
      font-family: 'Fraunces', serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.6rem 1.2rem;
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      text-transform: capitalize;
      position: relative;
      transition: all 0.2s;
    }
    .tab:first-child { padding-left: 0; }
    .tab:not(:last-child)::after {
      content: '|';
      position: absolute;
      right: 0;
      color: var(--red);
    }
    .tab:hover { color: var(--white); }
    .tab.active { 
      background: var(--red);
      color: var(--black);
    }
    .tab.active::after { display: none; }
    .tab-badge {
      font-size: 0.7rem;
      margin-left: 0.3rem;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 1rem;
      padding: 1.5rem 2rem;
      justify-content: flex-end;
      align-items: center;
    }
    .search-box {
      font-family: 'Fraunces', serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      background: var(--black);
      border: 2px solid var(--red);
      color: var(--white);
      width: 200px;
    }
    .search-box:focus { outline: none; }
    .search-box::placeholder { color: #666; }
    select {
      font-family: 'Fraunces', serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.5rem 0.8rem;
      background: var(--black);
      border: 2px solid var(--red);
      color: var(--white);
      cursor: pointer;
    }
    .btn {
      font-family: 'Fraunces', serif;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.5rem 1.2rem;
      background: var(--red);
      border: none;
      color: var(--black);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--white); }
    .btn-outline { 
      background: transparent; 
      border: 2px solid var(--red); 
      color: var(--red); 
    }
    .btn-outline:hover { background: var(--red); color: var(--black); }

    /* MAIN */
    .main { padding: 0 2rem 2rem; min-height: 60vh; }
    .section-title {
      font-family: 'Fraunces', serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--red);
      margin-bottom: 2rem;
      text-transform: lowercase;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: var(--red);
    }
    .empty {
      text-align: center;
      padding: 4rem;
      color: #555;
      font-size: 1rem;
    }

    /* FEATURED */
    .featured {
      background: var(--red);
      margin-bottom: 2rem;
      position: relative;
      cursor: pointer;
    }
    .featured-label {
      position: absolute;
      top: 0; left: 0;
      font-family: 'Fraunces', serif;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--black);
      color: var(--red);
      padding: 0.4rem 1rem;
      text-transform: lowercase;
    }
    .featured-inner { display: flex; gap: 1.5rem; padding: 1.5rem; padding-top: 2.5rem; }
    .featured-poster { width: 120px; flex-shrink: 0; }
    .featured-poster img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }
    .featured-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .featured-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--black);
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .featured-meta { color: var(--black); font-size: 0.9rem; font-weight: 600; opacity: 0.8; }
    @media (max-width: 600px) {
      .featured-inner { flex-direction: column; align-items: center; text-align: center; }
    }

    /* VHS GRID - Quinconce */
    .vhs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5rem 2rem;
      justify-content: center;
      padding: 2rem 1rem;
    }
    
    .vhs-case {
      width: 160px;
      cursor: pointer;
    }
    
    /* Quinconce - décalage vertical alterné */
    .vhs-case:nth-child(even) {
      margin-top: 40px;
    }
    
    .vhs-wrapper {
      position: relative;
      display: flex;
    }
    
    /* Le boîtier VHS */
    .vhs-sleeve {
      position: relative;
      width: 100%;
      background: var(--black);
      transition: transform 0.3s ease;
      /* Lueur interne + grain */
      box-shadow: 
        inset 0 0 30px rgba(251, 31, 41, 0.15),
        inset 0 0 60px rgba(251, 31, 41, 0.08);
    }
    
    /* Grain/noise effect */
    .vhs-sleeve::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }
    
    .vhs-poster {
      position: relative;
      overflow: hidden;
    }
    .vhs-poster img { 
      width: 100%; 
      aspect-ratio: 2/3; 
      object-fit: cover; 
      display: block;
    }
    .vhs-noimg {
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--gray);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    
    /* La cassette VHS qui sort à droite */
    .vhs-tape {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%) translateX(100%);
      width: 45px;
      height: 75%;
      background: #1a1a1a;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 3px solid #333;
    }
    
    /* Fenêtre de la cassette */
    .vhs-tape-window {
      width: 30px;
      height: 20px;
      background: linear-gradient(to bottom, #0a0a0a, #151515);
      border: 2px solid #222;
      border-radius: 2px;
      position: relative;
      margin-bottom: 8px;
    }
    
    /* Bobines */
    .vhs-tape-window::before,
    .vhs-tape-window::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      background: #333;
      border-radius: 50%;
      transform: translateY(-50%);
    }
    .vhs-tape-window::before { left: 3px; }
    .vhs-tape-window::after { right: 3px; }
    
    /* Label sur la cassette - vertical */
    .vhs-tape-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      font-family: 'Fraunces', serif;
      font-size: 0.45rem;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      max-height: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    /* Animation au survol */
    .vhs-case:hover .vhs-tape {
      opacity: 1;
      transform: translateY(-50%) translateX(5px);
    }
    
    /* Badges */
    .vhs-badges {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }
    .vhs-badge {
      font-family: 'Fraunces', serif;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 0.2rem 0.4rem;
      background: var(--red);
      color: var(--black);
    }
    
    .vhs-proposer {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      z-index: 2;
    }
    
    .vhs-fav-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      background: var(--black);
      border: 2px solid var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      z-index: 2;
      color: var(--red);
    }
    .vhs-case:hover .vhs-fav-btn { opacity: 1; }
    .vhs-fav-btn:hover { background: var(--red); color: var(--black); }
    .vhs-fav-btn.active { opacity: 1; background: var(--red); color: var(--black); }

    /* MODAL */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal {
      background: var(--black);
      border: 3px solid var(--red);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      background: var(--red);
    }
    .modal-title {
      font-family: 'Fraunces', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--black);
      text-transform: lowercase;
    }
    .modal-close { 
      background: none; 
      border: none; 
      color: var(--black); 
      font-size: 1.5rem; 
      cursor: pointer; 
      font-weight: bold;
      line-height: 1;
    }
    .modal-close:hover { color: var(--white); }
    .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.2rem;
      background: var(--black);
      border-top: 2px solid var(--red);
      flex-wrap: wrap;
    }
    .modal-actions .btn { flex: 1; text-align: center; }

    .detail-top { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
    .detail-poster { width: 120px; flex-shrink: 0; }
    .detail-poster img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }
    .detail-info { flex: 1; }
    .detail-title {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.5rem;
      color: var(--red);
    }
    .detail-meta { color: #888; font-size: 0.85rem; font-weight: 600; }
    .detail-proposer {
      display: inline-block;
      margin-top: 0.75rem;
      font-family: 'Fraunces', serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      background: var(--red);
      color: var(--black);
    }
    .detail-section { margin-top: 1.5rem; }
    .detail-section-title {
      font-family: 'Fraunces', serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--red);
      margin-bottom: 0.5rem;
      text-transform: lowercase;
    }
    .detail-text { font-size: 0.85rem; line-height: 1.6; color: #aaa; font-weight: 600; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag { 
      font-size: 0.7rem; 
      font-weight: 600;
      padding: 0.25rem 0.5rem; 
      background: var(--gray); 
      border: 1px solid #333; 
    }
    .voters-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .voter-chip {
      font-family: 'Fraunces', serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      background: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .voter-chip.fav::before { content: '♥'; color: var(--red); }
    .voter-chip.vote::before { content: '+'; color: var(--white); }
    .links { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .link-btn {
      font-family: 'Fraunces', serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.4rem 0.7rem;
      background: transparent;
      border: 2px solid var(--red);
      color: var(--red);
      text-decoration: none;
      transition: all 0.2s;
    }
    .link-btn:hover { background: var(--red); color: var(--black); }

    .search-results { display: flex; flex-direction: column; gap: 0.5rem; max-height: 300px; overflow-y: auto; margin: 1rem 0; }
    .search-result {
      display: flex;
      gap: 1rem;
      padding: 0.75rem;
      background: var(--black);
      border: 2px solid var(--gray);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .search-result:hover { border-color: var(--red); }
    .search-result img { width: 50px; height: 75px; object-fit: cover; }
    .result-noimg { width: 50px; height: 75px; background: var(--gray); display: flex; align-items: center; justify-content: center; color: #555; }
    .result-title { font-family: 'Fraunces', serif; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; }
    .result-meta { font-size: 0.8rem; color: #888; font-weight: 600; }

    /* Calendar */
    .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .calendar-month { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 700; text-transform: lowercase; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; }
    .calendar-header { font-family: 'Fraunces', serif; font-size: 0.8rem; font-weight: 700; color: var(--red); text-align: center; padding: 0.5rem; }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gray);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .calendar-day:hover { background: var(--red); color: var(--black); }
    .calendar-day.available { background: var(--red); color: var(--black); }
    .calendar-day.past { opacity: 0.3; pointer-events: none; }
    .calendar-day-num { font-family: 'Fraunces', serif; font-size: 1rem; font-weight: 700; }
    .calendar-day-count { position: absolute; bottom: 2px; font-size: 0.55rem; font-weight: 700; }

    /* History */
    .history-item {
      display: flex;
      gap: 1rem;
      padding: 0.8rem;
      background: var(--black);
      border: 2px solid var(--gray);
      margin-bottom: 0.5rem;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .history-item:hover { border-color: var(--red); }
    .history-poster { width: 45px; flex-shrink: 0; }
    .history-poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .history-info { flex: 1; }
    .history-title { font-family: 'Fraunces', serif; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; }
    .history-meta { font-size: 0.75rem; color: #888; font-weight: 600; }
    .history-date { 
      font-family: 'Fraunces', serif; 
      font-size: 0.75rem; 
      font-weight: 700;
      padding: 0.3rem 0.6rem; 
      background: var(--red);
      color: var(--black);
    }

    /* Members */
    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
    .member-card { 
      background: var(--black); 
      border: 2px solid var(--gray); 
      padding: 1.2rem 0.8rem; 
      text-align: center; 
      transition: border-color 0.2s; 
    }
    .member-card:hover { border-color: var(--red); }
    .member-avatar { 
      width: 50px; 
      height: 50px; 
      margin: 0 auto 0.8rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-family: 'Fraunces', serif; 
      font-size: 1.5rem; 
      font-weight: 800;
      color: var(--black); 
    }
    .member-name { 
      font-family: 'Fraunces', serif; 
      font-size: 1rem; 
      font-weight: 700;
      margin-bottom: 0.4rem;
      text-transform: capitalize;
    }
    .member-stats { font-size: 0.75rem; color: #888; line-height: 1.5; font-weight: 600; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Fraunces', serif;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.6rem 1.5rem;
      background: var(--red);
      color: var(--black);
      z-index: 2000;
      animation: toastIn 0.3s ease;
    }
    .toast.error { background: var(--black); color: var(--red); border: 2px solid var(--red); }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* Loading */
    .loading-screen { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      gap: 0.5rem; 
      background: var(--black); 
    }
    .loading-logo { 
      height: 50px;
      filter: invert(22%) sepia(95%) saturate(5000%) hue-rotate(350deg) brightness(95%) contrast(100%);
      animation: pulse 1.5s ease-in-out infinite; 
    }
    .loading-sub {
      font-family: 'Fraunces', serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Suggestions */
    .suggestions { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px solid var(--gray); }
    .suggestions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .suggestion-card { position: relative; overflow: hidden; transition: opacity 0.2s; }
    .suggestion-card:hover { opacity: 0.8; }
    .suggestion-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .suggestion-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.5rem 0.3rem 0.25rem; background: linear-gradient(transparent, rgba(0,0,0,0.95)); }
    .suggestion-title { font-size: 0.55rem; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
